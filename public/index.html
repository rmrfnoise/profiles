    .section-title { color: var(--ink); }
    .section-summary { color: var(--muted-light); }
    .section-chevron { color: #8aa391; }
    .field-add {
      border-color: var(--line-strong);
      background: #ffffff;
      color: var(--muted);
    }
    .field-add:hover { border-color: var(--accent); background: var(--accent-faint); color: var(--accent-deep); }
    .field-label { color: var(--muted-light); }
    .field-value { color: var(--ink-soft); }
    .field-value .auto-note { color: var(--muted-light); }
    .field-avatar-value span { color: var(--muted); }
    .custom-badge {
      border-color: #bcd5c5;
      background: var(--accent-faint);
      color: var(--accent-deep);
    }
    .custom-fields { border-top-color: #e4ebe2; }
    .subsection-head h3 { color: var(--muted); }
    .subsection-head h3::before { color: #87a994; }
    .subsection-head-actions > span { color: var(--muted-light); }

    .social-list { background: transparent; }
    .social-row {
      border-color: #e1e9e1;
      background: #f7f9f6;
    }
    .social-row + .social-row { border-top-color: #e1e9e1; }
    .social-row:hover { border-color: #bcd4c3; background: #f4f8f4; box-shadow: none; }
    .platform-mark {
      border-color: #c5d8ca;
      background: #ffffff;
      color: var(--accent-deep);
      box-shadow: none;
    }
    .social-main strong { color: var(--ink-soft); }
    .social-main span { color: var(--muted); }
    .social-note { color: var(--muted-light); }
    .social-remove { color: #91a596; opacity: 0.75; }
    .social-remove:hover { background: var(--danger-soft); color: var(--danger); }
    .address-row {
      border-color: #e1e9e1;
      background: #f7f9f6;
    }
    .addr-mark {
      border-color: #bcd5c5;
      background: var(--accent-faint);
      color: var(--accent-deep);
    }
    .addr-mark.alt { border-color: var(--line); color: var(--muted); }
    .addr-kind { color: var(--muted-light); }
    .address-text { color: var(--ink-soft); }
    .interest-item { color: var(--ink-soft); }
    .interest-item::before { background: var(--accent); opacity: 0.7; }
    .custom-empty {
      border-color: #d2dfd4;
      background: #f7f9f6;
    }
    .custom-empty p { color: var(--muted); }
    .custom-empty .ghost-btn { background: #ffffff; box-shadow: none; }

    .relations-card {
      border-color: var(--line);
      background: #ffffff;
      box-shadow: var(--shadow-tiny);
    }
    .relations-head { border-bottom-color: #e4ebe2; }
    .relations-head h2 { color: var(--ink); }
    .relations-head p { color: var(--muted-light); }
    .relations-count { border-color: #bcd5c5; background: var(--accent-faint); color: var(--accent-deep); }
    .relation-item { border-bottom-color: #edf1ec; }
    .relation-person:hover { background: #f4f8f4; }
    .relation-copy strong { color: var(--ink-soft); }
    .relation-copy span { color: var(--muted); }
    .relation-kind { color: var(--accent); }
    .relation-arrow { color: #94ab9a; }
    .relation-action { border-color: var(--line); background: #ffffff; color: var(--muted-light); }
    .relation-remove:hover { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .relations-empty { color: var(--muted); }
    .relations-empty strong { color: var(--ink-soft); }
    .relations-add-btn { border-color: var(--line-strong); background: #ffffff; color: var(--muted); }
    .relations-add-btn:hover { border-color: var(--accent); background: var(--accent-faint); }
    .side-note { color: var(--muted-light); }
    .side-note::before { color: #98b0a0; }

    .btn-primary {
      border-color: var(--accent-deep);
      background: var(--accent-deep);
      color: #ffffff;
      box-shadow: none;
      text-shadow: none;
    }
    .btn-primary:hover { border-color: var(--accent); background: var(--accent); color: #ffffff; box-shadow: none; }
    .btn-secondary {
      border-color: var(--line-strong);
      background: #ffffff;
      color: var(--ink-soft);
    }
    .btn-secondary:hover { border-color: #9ebdaa; background: #f4f8f4; color: var(--ink); }
    .btn-danger { border-color: #e2b6b2; background: #fffafa; color: var(--danger); box-shadow: none; }
    .btn-danger:hover { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); box-shadow: none; }
    .text-button { color: var(--accent-deep); }
    .text-button:hover { color: var(--accent); text-shadow: none; }

    .modal-backdrop {
      background: rgba(20, 32, 25, 0.34);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .modal {
      border: 1px solid #b7cdbf;
      border-top: 2px solid var(--accent);
      border-radius: 2px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(22, 32, 25, 0.18);
      padding: 24px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .modal-head h2 { color: var(--ink); text-shadow: none; }
    .modal-head p { color: var(--muted); }
    .modal .kicker { color: var(--accent); }
    .modal-close {
      border-color: var(--line-strong);
      background: #f7f9f6;
      color: var(--muted);
    }
    .modal-close:hover { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .form-field > span { color: var(--muted); }
    .form-field input,
    .form-field textarea,
    .form-field select {
      border-color: #c9d7cb;
      background: #ffffff;
      box-shadow: inset 0 1px 2px rgba(22, 32, 25, 0.025);
      color: var(--ink);
    }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: #6f8074; opacity: 1; }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--accent);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(11, 122, 84, 0.13);
    }
    .form-field select {
      background-image: linear-gradient(45deg, transparent 50%, #587263 50%), linear-gradient(135deg, #587263 50%, transparent 50%);
      background-size: 5px 5px, 5px 5px;
      background-position: calc(100% - 15px) 18px, calc(100% - 10px) 18px;
      background-repeat: no-repeat;
    }
    .form-error { color: var(--danger); text-shadow: none; }
    .avatar-editor { border-color: #cad9cd; background: #f7f9f6; }
    .avatar-preview { border-color: var(--line-strong); box-shadow: none; filter: grayscale(0.7); }
    .avatar-editor-actions .ghost-btn { background: #ffffff; }
    .segment-ui {
      border-color: var(--line-strong);
      background: #ffffff;
    }
    .segment-ui strong { color: var(--ink-soft); }
    .segment-ui small { color: var(--muted-light); }
    .segment input:checked + .segment-ui {
      border-color: var(--accent);
      background: var(--accent-faint);
      box-shadow: 0 0 0 2px rgba(11, 122, 84, 0.09);
    }
    .segment input:checked + .segment-ui strong { color: var(--accent-deep); }
    .modal-actions { border-top-color: #e4ebe2; }
    .confirm-copy {
      border-color: #eccbc8;
      background: var(--danger-soft);
      color: #79413c;
    }
    .confirm-copy strong { color: var(--danger); }
    .confirm-copy span { color: #875550; }

    .graph-panel {
      border-color: var(--line);
      background: #ffffff;
      box-shadow: var(--shadow-tiny);
    }
    .graph-toolbar {
      border-bottom-color: var(--line);
      background: #ffffff;
      box-shadow: none;
    }
    .graph-legend { color: var(--muted); }
    .legend-line { background: #7f9f8a; }
    .legend-line::after { border-color: #7f9f8a; background: #ffffff; }
    .legend-arc { color: #7f9f8a; }
    .legend-arc path + path { stroke: #7f9f8a; }
    .graph-tools .switch { color: var(--muted); }
    .graph-tools .switch-track {
      border-color: var(--line-strong);
      background: #e4eae3;
      box-shadow: none;
    }
    .graph-tools .switch-track::after { background: #ffffff; box-shadow: 0 1px 2px rgba(22, 32, 25, 0.14); }
    .graph-tools .switch input:checked + .switch-track { border-color: var(--accent); background: var(--accent); box-shadow: none; }
    .graph-tools .switch input:checked + .switch-track::after { background: #ffffff; box-shadow: none; }
    .graph-stage {
      background-color: #f2f6f1;
      background-image:
        linear-gradient(rgba(23, 33, 26, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 26, 0.055) 1px, transparent 1px),
        radial-gradient(circle at 50% 50%, rgba(11, 122, 84, 0.025), transparent 65%);
      background-size: 32px 32px, 32px 32px, auto;
    }
    .graph-edge line { stroke: #6f927c; stroke-width: 1.2; }
    .graph-edge .edge-curve { stroke: #6f927c; stroke-width: 1.2; }
    .graph-edge.is-active line, .graph-edge.is-active .edge-curve { stroke: var(--accent); stroke-opacity: 0.95; }
    .edge-label rect {
      fill: #ffffff;
      stroke: #cfdcd2;
      stroke-width: 1;
      filter: none;
    }
    .edge-label text { fill: #53695b; }
    .graph-edge.is-active .edge-label text { fill: var(--accent-deep); }
    .graph-node { filter: drop-shadow(0 3px 6px rgba(22, 32, 25, 0.1)); }
    .graph-node .node-backdrop { fill: #ffffff; stroke: #7da88a; stroke-width: 1.2; }
    .graph-node:hover .node-backdrop,
    .graph-node:focus-visible .node-backdrop { stroke: var(--accent); stroke-width: 1.6; }
    .graph-node .node-halo { stroke: var(--accent); }
    .graph-node image { filter: grayscale(0.7) contrast(1.02); }
    .graph-node:hover image { filter: none; }
    .graph-node .node-name {
      fill: var(--ink-soft);
      stroke: #f2f6f1;
    }
    .graph-zoom {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 14px rgba(22, 32, 25, 0.08);
      backdrop-filter: none;
    }
    .graph-zoom button { border-top-color: #e2e9e1; color: var(--muted); }
    .graph-zoom button:hover { background: var(--accent-faint); color: var(--accent-deep); }
    .graph-hint {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: none;
      color: var(--muted);
    }
    .graph-hint::before { color: #98b0a0; }
    .graph-side-panel {
      border-color: #b7cfc0;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 16px 40px rgba(22, 32, 25, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .panel-close { border-color: var(--line-strong); background: #f7f9f6; color: var(--muted); }
    .panel-close:hover { border-color: var(--accent); color: var(--accent-deep); }
    .panel-profile h2 { color: var(--ink); }
    .panel-profile p { color: var(--muted); }
    .panel-facts {
      border-top-color: #e4ebe2;
      border-bottom-color: #e4ebe2;
      background: #f7f9f6;
    }
    .panel-fact dt { color: var(--muted-light); }
    .panel-fact dd { color: var(--ink-soft); }
    .panel-section-head { border-bottom-color: #e4ebe2; }
    .panel-section-head h3 { color: var(--muted); }
    .panel-section-head span { color: var(--muted-light); }
    .panel-relation { border-bottom-color: #edf1ec; }
    .panel-relation:hover { background: #f4f8f4; }
    .panel-relation-name { color: var(--ink-soft); }
    .panel-relation-label { color: var(--accent); }
    .panel-no-relations { color: var(--muted); }
    .panel-note { color: var(--muted-light); }
    .panel-note::before { color: #98b0a0; }
    .panel-focus-btn { border-color: var(--line-strong); background: #ffffff; color: var(--muted); }
    .panel-focus-btn:hover { border-color: #9dbcaa; background: #f4f8f4; color: var(--ink-soft); }
    .panel-cta { border-color: var(--accent-deep); background: var(--accent-deep); color: #ffffff; box-shadow: none; }
    .panel-cta:hover { background: var(--accent); box-shadow: none; }
    .graph-focus-bar {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 4px 14px rgba(22, 32, 25, 0.08);
      color: var(--ink-soft);
    }
    .graph-focus-bar button { border-color: #bcd5c5; background: var(--accent-faint); color: var(--accent-deep); }
    .graph-focus-bar button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .focus-dot { background: var(--accent); box-shadow: none; }

    .site-footer { border-top-color: var(--line); background: transparent; }
    .footer-inner { color: var(--muted-light); }
    .footer-brand { color: var(--muted); }
    .footer-brand::before { background: var(--accent); box-shadow: none; }
    .footer-note { color: var(--muted-light); }

    .toast {
      border-color: var(--accent-deep);
      border-left-color: var(--accent);
      background: #0d3b27;
      color: #effff4;
      box-shadow: 0 10px 26px rgba(22, 32, 25, 0.18);
    }
    .toast::before { color: #8ff0b0; }
    .not-found {
      border-color: #e5c2bf;
      background: #ffffff;
      box-shadow: var(--shadow-tiny);
    }
    .not-found h1 { color: var(--danger); }
    .not-found p { color: var(--muted); }
    .loading-dots span { background: var(--accent); }

    .skip-link {
      border-color: var(--accent);
      background: #ffffff;
      color: var(--accent-deep);
      box-shadow: var(--shadow-tiny);
    }
    .skip-link:focus { color: var(--accent-deep); }
    .form-field select option{ background: #ffffff; color: var(--ink); }
    .custom-field-remove { color: #91a596; }
    .custom-field-remove:hover { background: var(--danger-soft); color: var(--danger); }

    /* Light-theme legibility floor */
    .card-fact span { font-size: 10.5px; }
    .card-fact strong { font-size: 13px; }
    .card-note { font-size: 12px; }
    .field-label { font-size: 11px; }
    .field-value { font-size: 13.5px; }
    .section-summary { font-size: 10.5px; }
    .subsection-head h3 { font-size: 11px; }
    .social-note { font-size: 10.5px; }
    .stat span { font-size: 10.5px; }
    .form-field > span { font-size: 11px; }
    .form-field input,
    .form-field textarea,
    .form-field select { font-size: 13.5px; }
    .modal-head p { font-size: 12.5px; }
    .profile-sub { font-size: 12px; }
    .profile-quick { font-size: 11.5px; }
    .footer-inner { font-size: 10px; }
    .footer-note { font-size: 10px; }
    .toast { font-size: 11px; }
    .graph-hint { font-size: 10px; }
    .legend-item { font-size: 10px; }

    @media (max-width: 660px) {
      .card-fact span { font-size: 10px; }
      .card-fact strong { font-size: 12.5px; }
      .card-note { font-size: 11px; }
      .field-label { font-size: 10.5px; }
      .field-value { font-size: 13px; }
      .form-field > span { font-size: 10.5px; }
      .form-field input,
      .form-field textarea,
      .form-field select { font-size: 13px; }
      .social-note { font-size: 10px; }
      .footer-inner, .footer-note { font-size: 9.5px; }
    }

    /* ==================================================================
       PAPER ARCHIVE // warm paper, ink, archive green, seal red
       ================================================================== */
    @font-face {
      font-family: "Archive Song";
      src: local("字体圈欣意吉祥宋"), local("字体圈欣意吉祥宋 Regular"), local("欣意吉祥宋");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #f1ece0;
      --bg-deep: #e9e2d3;
      --surface: #fbf8f0;
      --surface-solid: #fbf8f0;
      --white: #fffdf8;
      --ink: #2a2820;
      --ink-soft: #3b382d;
      --muted: #6c6658;
      --muted-light: #817a6a;
      --line: #d8d0be;
      --line-strong: #c4b8a3;
      --accent: #3e5b49;
      --accent-deep: #2e4637;
      --accent-soft: #e8efe7;
      --accent-faint: #f3f6f1;
      --seal: #a64736;
      --seal-soft: #f3e5e0;
      --danger: #9d3a30;
      --danger-soft: #f8ece9;
      --shadow-soft: 0 16px 40px rgba(60, 48, 32, 0.09);
      --shadow-tiny: 0 1px 2px rgba(60, 48, 32, 0.04);
      --shadow-card: 0 1px 2px rgba(60, 48, 32, 0.04), 0 10px 28px rgba(60, 48, 32, 0.045);
      --sans: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --mono: var(--sans);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
      --display: "Archive Song", "字体圈欣意吉祥宋", "欣意吉祥宋", "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      --radius-lg: 4px;
      --radius-md: 3px;
      --radius-sm: 2px;
    }
    html { color-scheme: light; }
    html, body { min-height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 18% 0%, rgba(255, 255, 255, 0.72), transparent 44%),
        radial-gradient(ellipse at 88% 100%, rgba(139, 119, 88, 0.075), transparent 38%),
        repeating-linear-gradient(90deg, rgba(94, 76, 50, 0.016) 0, rgba(94, 76, 50, 0.016) 1px, transparent 1px, transparent 4px),
        var(--bg);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14.5px;
      line-height: 1.7;
      caret-color: var(--accent);
      -webkit-font-smoothing: auto;
      text-rendering: optimizeLegibility;
    }
    body::after { display: none; }
    ::selection { background: var(--seal); color: #fffaf2; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    * { scrollbar-width: thin; scrollbar-color: #b3a68f #f1ece0; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: #f1ece0; border-left: 1px solid #e1d9c8; }
    *::-webkit-scrollbar-thumb { background: #b3a68f; border: 1px solid #cbbfa9; }
    *::-webkit-scrollbar-thumb:hover { background: #9d8f77; }

    .site-header {
      background: rgba(250, 247, 239, 0.92);
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }
    .header-inner { height: 72px; gap: 28px; }
    .brand { gap: 10px; }
    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid #853b2d;
      border-radius: 2px;
      background: var(--seal);
      color: #fff8ee;
      box-shadow: none;
      font-family: var(--display);
      font-size: 19px;
      font-weight: 400;
      letter-spacing: 0;
      text-shadow: none;
    }
    .brand-word {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: none;
    }
    .brand-sub {
      margin-left: 2px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .site-nav {
      align-self: center;
      gap: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .nav-link {
      height: 32px;
      padding: 0 0 3px;
      border: 0;
      border-radius: 0;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: none;
      box-shadow: inset 0 -1.5px 0 transparent;
    }
    .nav-link:hover { color: var(--ink); background: transparent; box-shadow: inset 0 -1.5px 0 #b9c9ba; }
    .nav-link[aria-current="page"] {
      color: var(--ink);
      background: transparent;
      box-shadow: inset 0 -1.5px 0 var(--accent);
    }
    .header-note {
      border-color: var(--line);
      background: rgba(255, 253, 248, 0.7);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 10.5px;
      letter-spacing: 0.03em;
    }
    .header-note::before { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: none; }

    .page { padding: 52px 0 84px; }
    .page-head { margin-bottom: 34px; gap: 36px; align-items: flex-end; }
    .kicker {
      margin-bottom: 11px;
      color: var(--accent);
      font-family: var(--sans);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .kicker::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      background: var(--seal);
      vertical-align: 1px;
    }
    .page-head h1 {
      color: var(--ink);
      font-family: var(--display);
      font-size: clamp(42px, 4.6vw, 56px);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.16;
      text-shadow: none;
    }
    .page-head h1::after,
    .profile-title h1::after { content: none; }
    .page-head .page-sub {
      max-width: 600px;
      margin-top: 10px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.8;
    }
    .page-stats {

  <div id="modal-root"></div>

  <script>
    (() => {
      "use strict";

      /* ------------------------------------------------------------------
       * Prototype data — entirely fictional.
       * ------------------------------------------------------------------ */
      let people = [];
      let relations = [];
      const graphPositions = {};

      const sectionNames = {
        basic: "基本信息",
        contact: "联系与账号",
        address: "地址",
        interests: "兴趣与描述",
        custom: "自定义字段",
        standalone: "单独成区"
      };

      const avatarPalette = [
        { bg: "#e5e2d8", ink: "#4f574a", shape: "#7f8b74" },
        { bg: "#e9e1d9", ink: "#5c4b3f", shape: "#a58f7d" },
        { bg: "#dde5e2", ink: "#405850", shape: "#789288" },
        { bg: "#e3dfe8", ink: "#4f4859", shape: "#8b8098" },
        { bg: "#eae5d7", ink: "#58513e", shape: "#97906d" },
        { bg: "#e0e3e9", ink: "#454d5d", shape: "#7d889c" },
        { bg: "#e6e3da", ink: "#505348", shape: "#8b9282" },
        { bg: "#e8ddd8", ink: "#5a473f", shape: "#a08b80" }
      ];

      const state = {
        query: "",
        graphShowIsolated: true,
        expandedSections: new Set(),
        currentDetailId: null,
        highlightPersonId: null,
        modalTarget: "standalone",
        photoUploading: false
      };

      let graphCtx = null;
      let currentSelectedNode = null;
      let modalLastFocus = null;
      let toastTimer = null;

      /* ------------------------------------------------------------------
       * Helpers
       * ------------------------------------------------------------------ */
      const escapeMap = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => escapeMap[char]);
      const icon = (paths, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${paths}</svg>`;
      const icons = {
        close: icon('<path d="M6 6l12 12M18 6 6 18"></path>'),
        arrowRight: icon('<path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path>'),
        arrowUpRight: icon('<path d="M7 17 17 7"></path><path d="M8 7h9v9"></path>'),
        chevronDown: icon('<path d="m6 9 6 6 6-6"></path>'),
        back: icon('<path d="m15 18-6-6 6-6"></path>'),
        link: icon('<circle cx="6" cy="12" r="2.3"></circle><circle cx="18" cy="6" r="2.3"></circle><circle cx="18" cy="18" r="2.3"></circle><path d="m8.1 10.9 7.8-3.8M8.1 13.1l7.8 3.8"></path>'),
        graph: icon('<circle cx="6" cy="7" r="2.4"></circle><circle cx="18" cy="6" r="2.4"></circle><circle cx="13" cy="18" r="2.4"></circle><path d="m8.4 7.2 7.2-.2M7.2 9l4.6 7M16.8 8.1l-2.7 7.5"></path>'),
        plus: icon('<path d="M12 5v14M5 12h14"></path>'),
        info: icon('<circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path>'),
        mail: icon('<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path>'),
        phone: icon('<path d="M7.3 3.7 9.5 8l-2 1.7a14 14 0 0 0 6.8 6.8l1.7-2 4.3 2.2-.6 2.3a2 2 0 0 1-2.2 1.4c-8-.9-14.2-7.1-15.1-15.1a2 2 0 0 1 1.4-2.2l2.3-.6Z"></path>'),
        grip: icon('<path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"></path>'),
        idCard: icon('<rect x="2.5" y="5" width="19" height="14" rx="2.2"></rect><circle cx="8" cy="10.6" r="1.9"></circle><path d="M4.9 16c.6-1.6 1.7-2.4 3.1-2.4s2.5.8 3.1 2.4M14 9.5h4.5M14 12.5h4.5M14 15.5h3"></path>'),
        fit: icon('<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>'),
        edit: icon('<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>'),
        trash: icon('<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v5M14 11v5"></path>'),
        print: icon('<path d="M6 9V3h12v6"></path><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v7H6z"></path>'),
        userPlus: icon('<circle cx="9" cy="8" r="3.5"></circle><path d="M3 21c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M19 8v6M16 11h6"></path>'),
        camera: icon('<path d="M4 7h3l1.5-2h7L17 7h3v12H4Z"></path><circle cx="12" cy="13" r="3.2"></circle>'),
        fullscreen: icon('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>'),
        exitFullscreen: icon('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path>'),
        focus: icon('<circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>')
      };

      const byId = new Map();
      const relationCounts = new Map();
      const connectedIds = new Set();
      const searchIndex = new Map();

      function rebuildIndexes() {
        byId.clear();
        people.forEach((person) => byId.set(person.id, person));

        for (let index = relations.length - 1; index >= 0; index -= 1) {
          const relation = relations[index];
          if (!byId.has(relation.a) || !byId.has(relation.b)) relations.splice(index, 1);
        }

        relationCounts.clear();
        people.forEach((person) => relationCounts.set(person.id, 0));
        connectedIds.clear();
        relations.forEach((relation) => {
          relationCounts.set(relation.a, (relationCounts.get(relation.a) || 0) + 1);
          relationCounts.set(relation.b, (relationCounts.get(relation.b) || 0) + 1);
          connectedIds.add(relation.a);
          connectedIds.add(relation.b);
        });

        searchIndex.clear();
        people.forEach((person) => searchIndex.set(person.id, buildPersonSearchText(person)));
      }
      rebuildIndexes();

      function ensureGraphPosition(personId) {
        if (graphPositions[personId]) return graphPositions[personId];
        const occupied = people
          .filter((person) => person.id !== personId && graphPositions[person.id])
          .map((person) => graphPositions[person.id]);
        const candidates = [];
        [0, 1, 2].forEach((ring) => {
          const radiusX = 255 + ring * 62;
          const radiusY = 188 + ring * 51;
          const offset = ring * 0.24;
          for (let index = 0; index < 12; index += 1) {
            const angle = -Math.PI / 2 + index * (Math.PI / 6) + offset;
            candidates.push({
              x: 430 + Math.cos(angle) * radiusX,
              y: 290 + Math.sin(angle) * radiusY
            });
          }
        });
        let best = candidates[0];
        let bestDistance = -1;
        candidates.forEach((candidate) => {
          const nearest = occupied.length
            ? Math.min(...occupied.map((point) => Math.hypot(point.x - candidate.x, point.y - candidate.y)))
            : Infinity;
          if (nearest > bestDistance) {
            bestDistance = nearest;
            best = candidate;
          }
        });
        graphPositions[personId] = { x: Math.round(best.x), y: Math.round(best.y) };
        return graphPositions[personId];
      }

      const avatarCache = new Map();
      function generatedAvatarData(name) {
        let hash = 0;
        for (const char of name) hash = ((hash << 5) - hash + char.charCodeAt(0)) | 0;
        const palette = avatarPalette[Math.abs(hash) % avatarPalette.length];
        const initial = esc(Array.from(name.trim())[0] || "?");
        const seed = Math.abs(hash);
        const cx = 67 + (seed % 19);
        const cy = 19 + (seed % 17);
        const radius = 20 + (seed % 12);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
          <rect width="96" height="96" fill="${palette.bg}"/>
          <circle cx="${cx}" cy="${cy}" r="${radius}" fill="${palette.shape}" opacity="0.15"/>
          <path d="M-6 81 Q 22 58 48 76 T 104 70 V 100 H -6 Z" fill="${palette.shape}" opacity="0.10"/>
          <path d="M-8 20 Q 20 34 16 64" stroke="${palette.shape}" stroke-width="1.1" fill="none" opacity="0.24"/>
          <text x="48" y="55" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-weight="600" font-size="33" fill="${palette.ink}">${initial}</text>
        </svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function avatarData(person) {
        if (person.avatar) return person.avatar;
        if (avatarCache.has(person.id)) return avatarCache.get(person.id);
        const data = generatedAvatarData(person.name);
        avatarCache.set(person.id, data);
        return data;
      }

      function calcAge(birthDate) {
        if (!birthDate) return null;
        const birth = new Date(`${birthDate}T00:00:00`);
        if (Number.isNaN(birth.getTime())) return null;
        const now = new Date();
        let age = now.getFullYear() - birth.getFullYear();
        const monthDelta = now.getMonth() - birth.getMonth();
        if (monthDelta < 0 || (monthDelta === 0 && now.getDate() < birth.getDate())) age -= 1;
        return age;
      }

      function ageText(birthDate) {
        const age = calcAge(birthDate);
        return age === null ? "未知" : `${age} 岁`;
      }

      function formatBirthDate(birthDate) {
        if (!birthDate || !/^\d{4}-\d{2}-\d{2}$/.test(birthDate)) return "未填写";
        const [year, month, day] = birthDate.split("-");
        return `${year} 年 ${Number(month)} 月 ${Number(day)} 日`;
      }

      function isValidCalendarDate(year, month, day) {
        if (!Number.isInteger(year) || !Number.isInteger(month) || !Number.isInteger(day)) return false;
        if (year < 1900 || month < 1 || month > 12 || day < 1 || day > 31) return false;
        const date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return false;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return date <= today;
      }

      function parseBirthDateValue(rawValue) {
        const raw = String(rawValue || "").trim();
        if (!raw) return "";
        let match = raw.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
        if (!match) match = raw.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
        if (!match) match = raw.match(/^(\d{4})(\d{2})(\d{2})$/);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        if (!isValidCalendarDate(year, month, day)) return null;
        return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      const MOBILE_PATTERN = /^1[3-9]\d{9}$/;
      const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
      const ID_CARD_WEIGHTS = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
      const ID_CARD_CODES = ["1", "0", "X", "9", "8", "7", "6", "5", "4", "3", "2"];

      function isValidMobile(value) {
        return MOBILE_PATTERN.test(String(value || "").trim());
      }

      function isValidEmail(value) {
        return EMAIL_PATTERN.test(String(value || "").trim());
      }

      function isValidChineseIdCard(value) {
        const id = String(value || "").trim().toUpperCase();
        if (!/^\d{17}[\dX]$/.test(id)) return false;
        const year = Number(id.slice(6, 10));
        const month = Number(id.slice(10, 12));
        const day = Number(id.slice(12, 14));
        if (!isValidCalendarDate(year, month, day)) return false;
        const sum = ID_CARD_WEIGHTS.reduce((total, weight, index) => total + Number(id[index]) * weight, 0);
        return ID_CARD_CODES[sum % 11] === id[17];
      }

      function relationLabelFor(relation, personId) {
        if (relation.type === "role") {
          return personId === relation.a ? relation.forwardLabel : relation.reverseLabel;
        }
        return relation.label;
      }

      function relationExists(a, b) {
        return relations.some((relation) =>
          (relation.a === a && relation.b === b) || (relation.a === b && relation.b === a)
        );
      }

      function relationsFor(personId) {
        return relations
          .filter((relation) => relation.a === personId || relation.b === personId)
          .map((relation) => {
            const otherId = relation.a === personId ? relation.b : relation.a;
            return {
              relation,
              other: byId.get(otherId),
              label: relationLabelFor(relation, personId),
              directed: relation.type === "role"
            };
          })
          .filter((item) => item.other)
          .sort((a, b) => a.other.name.localeCompare(b.other.name, "zh-Hans-CN"));
      }

      function customFor(person, target) {
        return person.customFields.filter((field) => field.target === target);
      }

      function buildPersonSearchText(person) {
        const relationText = relations.flatMap((relation) => {
          if (relation.a !== person.id && relation.b !== person.id) return [];
          return [
            relationLabelFor(relation, person.id),
            relation.type === "role" ? "角色" : "对等"
          ];
        });
        return [
          person.name,
          person.gender || "未知",
          person.birthDate,
          formatBirthDate(person.birthDate),
          ageText(person.birthDate),
          person.phone,
          person.email,
          person.idCard,
          person.note,
          ...(person.contacts || []).flatMap((contact) => [
            contact.type === "email" ? "邮箱" : "手机号",
            contact.value,
            contact.note
          ]),
          ...(person.socials || []).flatMap((social) => [
            social.platform,
            social.handle,
            social.note
          ]),
          ...(person.addresses || []).flatMap((address) => [
            address.kind,
            address.note,
            address.text
          ]),
          ...(person.companies || []).flatMap((company) => [
            company.name,
            company.role,
            company.creditCode,
            company.note
          ]),
          ...(person.interests || []),
          ...(person.customFields || []).flatMap((fieldItem) => [
            fieldItem.name,
            fieldItem.value
          ]),
          ...relationText
        ].filter(Boolean).join(" ").toLowerCase();
      }

      function searchMatches(person, rawQuery) {
        const query = rawQuery.trim().toLowerCase();
        if (!query) return true;
        const haystack = searchIndex.get(person.id) || buildPersonSearchText(person);
        return haystack.includes(query);
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2600);
      }

      async function apiRequest(url, options = {}) {
        const headers = { Accept: "application/json", ...(options.headers || {}) };
        if (options.body) headers["Content-Type"] = "application/json";
        const response = await fetch(url, { ...options, headers });
        let payload = null;
        try {
          payload = await response.json();
        } catch {
          payload = null;
        }
        if (!response.ok) {
          throw new Error(payload?.error || `请求失败（${response.status}）`);
        }
        return payload;
      }

      function ensureAllGraphPositions() {
        const currentIds = new Set(people.map((person) => person.id));
        Object.keys(graphPositions).forEach((id) => {
          if (!currentIds.has(id)) delete graphPositions[id];
        });
        people.forEach((person) => ensureGraphPosition(person.id));
      }

      async function loadData() {
        const [nextPeople, nextRelations] = await Promise.all([
          apiRequest("/api/people"),
          apiRequest("/api/relations")
        ]);
        people = Array.isArray(nextPeople) ? nextPeople : [];
        relations = Array.isArray(nextRelations) ? nextRelations : [];
        avatarCache.clear();
        rebuildIndexes();
        ensureAllGraphPositions();
      }

      function primaryContactValue(contacts, type) {
        return (contacts || []).find((contact) => contact.type === type)?.value || "";
      }

      function makeContactId() {
        return `contact-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
      }

      function personPayload(person) {
        const contacts = (person.contacts || []).map((contact) => ({ ...contact }));
        return {
          name: person.name || "",
          gender: person.gender || "",
          birthDate: person.birthDate || "",
          phone: primaryContactValue(contacts, "phone"),
          email: primaryContactValue(contacts, "email"),
          idCard: person.idCard || "",
          note: person.note || "",
          contacts,
          avatar: person.avatar || null,
          socials: person.socials || [],
          addresses: person.addresses || [],
          companies: person.companies || [],
          photos: person.photos || [],
          interests: person.interests || [],
          customFields: person.customFields || []
        };
      }

      function draftPerson(person) {
        return {
          ...person,
          contacts: (person.contacts || []).map((item) => ({ ...item })),
          socials: (person.socials || []).map((item) => ({ ...item })),
          addresses: (person.addresses || []).map((item) => ({ ...item })),
          companies: (person.companies || []).map((item) => ({ ...item })),
          photos: [...(person.photos || [])],
          interests: [...(person.interests || [])],
          customFields: (person.customFields || []).map((item) => ({ ...item }))
        };
      }

      async function persistPersonDraft(draft) {
        return apiRequest(`/api/people/${draft.id}`, {
          method: "PUT",
          body: JSON.stringify(personPayload(draft))
        });

      async function reloadDataAndDetail(personId, message = "") {
        await loadData();
        const fresh = byId.get(String(personId));
        if (!fresh) {
          window.location.hash = "#/people";
          return;

        const scrollY = window.scrollY;
        renderDetailPage(fresh, { preserveScroll: true });
        window.scrollTo({ top: scrollY, behavior: "auto" });
        if (message) showToast(message);

        try {
          await persistPersonDraft(draft);
          await reloadDataAndDetail(draft.id, message);

          showToast(error.message);

      const PHOTO_FILE_TYPES = new Set(["image/jpeg", "image/jpg", "image/png", "image/webp"]);

      function drawPhotoJpeg(image, maxSide, quality) {
        const width = image.naturalWidth;
        const height = image.naturalHeight;
        if (!width || !height) throw new Error("无法读取图片。");
        const scale = Math.min(1, maxSide / Math.max(width, height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(width * scale));
        canvas.height = Math.max(1, Math.round(height * scale));
        const context = canvas.getContext("2d");
        context.fillStyle = "#f5f4f0";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      function preparePhotoPayload(file) {
        return new Promise((resolve, reject) => {
          if (!PHOTO_FILE_TYPES.has(file.type)) {
            reject(new Error("仅支持 JPEG、PNG、WebP 图片。"));
            return;
          }
          if (file.size > 25 * 1024 * 1024) {
            reject(new Error("图片不能超过 25 MB。"));
            return;
          }
          const objectUrl = URL.createObjectURL(file);
          const image = new Image();
          image.addEventListener("load", () => {
            try {
              const display = drawPhotoJpeg(image, 1600, 0.82);
              const thumb = drawPhotoJpeg(image, 480, 0.78);
              resolve({ display, thumb });
            } catch (error) {
              reject(error);
            } finally {
              URL.revokeObjectURL(objectUrl);
            }
          });
          image.addEventListener("error", () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("无法读取图片。"));
          });
          image.src = objectUrl;
        });
      }

      async function addPhotoFiles(person, files) {
        const list = [...files].filter((file) => file && PHOTO_FILE_TYPES.has(file.type));
        if (!list.length) {
          showToast(files.length ? "仅支持 JPEG、PNG、WebP 图片。" : "请选择图片文件。");
          return;
        }
        if (state.photoUploading) {
          showToast("照片正在处理中，请稍候。");
          return;
        }
        state.photoUploading = true;
        const addButton = document.querySelector("[data-add-photo]");
        const originalHtml = addButton?.innerHTML || "";
        let added = 0;
        let failed = 0;
        let firstError = "";
        if (addButton) addButton.disabled = true;
        try {
          for (let index = 0; index < list.length; index += 1) {
            if (addButton && document.body.contains(addButton)) {
              addButton.textContent = `处理中 ${index + 1}/${list.length}`;
            }
            try {
              const payload = await preparePhotoPayload(list[index]);
              await apiRequest(`/api/people/${person.id}/photos`, {
                method: "POST",
                body: JSON.stringify(payload)
              });
              added += 1;
            } catch (error) {
              failed += 1;
              if (!firstError) firstError = error.message || "图片处理失败";
              console.error("Photo upload failed:", error);
            }
          }
          if (added) {
            await loadData();
            state.expandedSections.add("gallery");
            const fresh = byId.get(person.id);
            if (fresh) {
              const scrollY = window.scrollY;
              renderDetailPage(fresh, { preserveScroll: true });
              window.scrollTo({ top: scrollY, behavior: "auto" });
            }
          }
        } finally {
          state.photoUploading = false;
          if (addButton && document.body.contains(addButton)) {
            addButton.disabled = false;
            addButton.innerHTML = originalHtml;
          }
        }
        if (failed) showToast(`已添加 ${added} 张，${failed} 张失败${firstError ? `：${firstError}` : ""}。`);
        else showToast(`已添加 ${added} 张照片。`);
      }

        }
      }

      function openPhotoLightbox(person, startIndex) {
        const photos = person.photos || [];
        if (!photos.length) return;
        let index = Math.min(Math.max(0, startIndex), photos.length - 1);
        let deleteArmed = false;
        let deleteTimer = 0;
        const body = `<div class="photo-lightbox">
          <div class="photo-stage"><img id="photo-lightbox-image" src="/media/photos/${encodeURIComponent(photos[index])}.jpg" alt="照片 ${index + 1}"></div>
          <div class="photo-lightbox-bar">
            <span class="photo-lightbox-count" id="photo-lightbox-count">${index + 1} / ${photos.length}</span>
            <div class="photo-lightbox-actions">
              <button class="ghost-btn" type="button" data-photo-prev ${photos.length < 2 ? "hidden" : ""}>上一张</button>
              <button class="ghost-btn" type="button" data-photo-next ${photos.length < 2 ? "hidden" : ""}>下一张</button>
              <button class="ghost-btn is-danger" type="button" data-photo-delete>删除照片</button>
            </div>
          </div>
        </div>`;
        const root = openModalShell({
          kicker: "GALLERY",
          title: person.name || "照片",
          bodyHtml: body,
          wide: true
        });
        const image = document.getElementById("photo-lightbox-image");
        const count = document.getElementById("photo-lightbox-count");
        const deleteButton = root.querySelector("[data-photo-delete]");
        const modal = root.querySelector(".modal");
        const show = (nextIndex) => {
          index = (nextIndex + photos.length) % photos.length;
          image.src = `/media/photos/${encodeURIComponent(photos[index])}.jpg`;
          image.alt = `照片 ${index + 1}`;
          count.textContent = `${index + 1} / ${photos.length}`;
          deleteArmed = false;
          deleteButton.textContent = "删除照片";
          deleteButton.classList.remove("is-confirming");
          window.clearTimeout(deleteTimer);
        };
        root.querySelector("[data-photo-prev]")?.addEventListener("click", () => show(index - 1));
        root.querySelector("[data-photo-next]")?.addEventListener("click", () => show(index + 1));
        deleteButton.addEventListener("click", () => {
          if (!deleteArmed) {
            deleteArmed = true;
            deleteButton.textContent = "确认删除";
            deleteButton.classList.add("is-confirming");
            window.clearTimeout(deleteTimer);
            deleteTimer = window.setTimeout(() => {
              deleteArmed = false;
              if (document.body.contains(deleteButton)) {
                deleteButton.textContent = "删除照片";
                deleteButton.classList.remove("is-confirming");
              }
            }, 3000);
            return;
          }
          window.clearTimeout(deleteTimer);
          deletePhoto(person, photos[index]);
        });
        modal?.setAttribute("tabindex", "-1");
        modal?.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            show(index - 1);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            show(index + 1);
          }
        });
        window.requestAnimationFrame(() => modal?.focus({ preventScroll: true }));
      }

      function bindOrderableList(person, key, field, label) {
        const list = document.querySelector(`[data-${key}-list]`);
        const dropLine = list?.querySelector(`[data-${key}-drop-line]`);
        const rows = list ? [...list.querySelectorAll(`[data-${key}-row]`)] : [];
        if (!list || !dropLine || rows.length < 2) return;

        let dragIndex = -1;
        let dropIndex = -1;
        let rowMidpoints = [];
        let leaveTimer = 0;

        const hideDropLine = () => {
          dropIndex = -1;
          dropLine.classList.remove("is-visible");
        };

        const finishDrag = () => {
          window.clearTimeout(leaveTimer);
          dragIndex = -1;
          dropIndex = -1;
          dropLine.classList.remove("is-visible");
          rows.forEach((row) => row.classList.remove("is-dragging"));
        };

        const insertIndexAt = (y) => {
          for (let index = 0; index < rowMidpoints.length; index += 1) {
            if (y < rowMidpoints[index]) return index;
          }
          return rows.length;
        };

        const scheduleHide = () => {
          window.clearTimeout(leaveTimer);
          leaveTimer = window.setTimeout(hideDropLine, 60);
        };

        const showDropLine = (index) => {
          let top;
          if (index <= 0) {
            top = 0;
          } else if (index >= rows.length) {
            const last = rows[rows.length - 1];
            top = last.offsetTop + last.offsetHeight - 1;
          } else {
            const before = rows[index - 1];
            const after = rows[index];
            top = (before.offsetTop + before.offsetHeight + after.offsetTop) / 2 - 1;
          }
          dropLine.style.top = `${Math.max(0, top)}px`;
          dropLine.classList.add("is-visible");
        };

        const commitOrder = (from, to, restoreFocus = false) => {
          if (from === to) return;
          const draft = draftPerson(person);
          const items = draft[field];
          if (!Array.isArray(items)) return;
          const [moved] = items.splice(from, 1);
          if (!moved) return;
          items.splice(to, 0, moved);
          updatePersonDraft(draft, `${label}顺序已更新。`).then(() => {
            if (!restoreFocus) return;
            document.querySelector(`[data-${key}-row="${to}"] [data-drag-${key}]`)?.focus({ preventScroll: true });
          });
        };

        rows.forEach((row) => {
          const handle = row.querySelector(`[data-drag-${key}]`);
          if (!handle) return;

          handle.addEventListener("dragstart", (event) => {
            if (!event.dataTransfer) return;
            window.clearTimeout(leaveTimer);
            dragIndex = Number(row.getAttribute(`data-${key}-row`));
            rowMidpoints = rows.map((item) => item.offsetTop + item.offsetHeight / 2);
            hideDropLine();
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", String(dragIndex));
            if (event.dataTransfer.setDragImage) {
              event.dataTransfer.setDragImage(row, 18, 18);
            }
            window.requestAnimationFrame(() => row.classList.add("is-dragging"));
          });

          handle.addEventListener("dragend", finishDrag);

          handle.addEventListener("keydown", (event) => {
            if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
            event.preventDefault();
            const from = Number(row.getAttribute(`data-${key}-row`));
            const to = from + (event.key === "ArrowUp" ? -1 : 1);
            if (to < 0 || to >= person[field].length) return;
            commitOrder(from, to, true);
          });
        });

        list.addEventListener("dragover", (event) => {
          if (dragIndex < 0) return;
          event.preventDefault();
          window.clearTimeout(leaveTimer);
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          const y = event.clientY - list.getBoundingClientRect().top;
          const index = insertIndexAt(y);
          if (index === dropIndex) return;
          if (
            dropIndex >= 0
            && Math.abs(index - dropIndex) === 1
            && Math.abs(y - rowMidpoints[Math.min(index, dropIndex)]) < 5
          ) return;
          dropIndex = index;
          showDropLine(index);
        });

        list.addEventListener("dragleave", (event) => {
          if (event.relatedTarget instanceof Node && list.contains(event.relatedTarget)) return;
          scheduleHide();
        });

        list.addEventListener("drop", (event) => {
          if (dragIndex < 0) return;
          event.preventDefault();
          const from = dragIndex;
          const y = event.clientY - list.getBoundingClientRect().top;
          const index = insertIndexAt(y);
          finishDrag();
          if (index < 0) return;
          let to = index;
          if (to > from) to -= 1;
          if (to === from) return;
          commitOrder(from, to);
        });
      }

      function printProfile() {
        const sections = [...document.querySelectorAll(".detail-page .profile-section")];
        const states = sections.map((section) => ({
          section,
          open: section.classList.contains("is-open")
        }));
        sections.forEach((section) => {
          section.classList.add("is-open");
          const toggle = section.querySelector("[data-section-toggle]");
          if (toggle) toggle.setAttribute("aria-expanded", "true");
          const inner = section.querySelector(".section-body-inner");
          if (inner) {
            inner.removeAttribute("inert");
            inner.setAttribute("aria-hidden", "false");
          }
        });
        document.body.classList.add("print-mode");
        const restore = () => {
          document.body.classList.remove("print-mode");
          states.forEach(({ section, open }) => {
            section.classList.toggle("is-open", open);
            const toggle = section.querySelector("[data-section-toggle]");
            if (toggle) toggle.setAttribute("aria-expanded", String(open));
            const inner = section.querySelector(".section-body-inner");
            if (inner) {
              inner.toggleAttribute("inert", !open);
              inner.setAttribute("aria-hidden", String(!open));
            }
          });
          window.removeEventListener("afterprint", restore);
        };
        window.addEventListener("afterprint", restore, { once: true });
        window.print();
      }

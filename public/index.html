<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="纸本档案。记录人物、联系方式、地址与关系。">
  <title>Profiles · 纸本档案</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='3' fill='%23A64736'/%3E%3Cpath d='M14 23h15l4 6h17v20H14z' fill='none' stroke='%23FFF8EE' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M23 36h16M23 42h11' fill='none' stroke='%23FFF8EE' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#F1ECE0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/fonts/noto.css">
  <style>
    :root {
      --bg: #f5f4f0;
      --bg-deep: #efeee9;
      --surface: rgba(255, 255, 255, 0.58);
      --surface-solid: #fbfaf7;
      --white: #ffffff;
      --ink: #262823;
      --ink-soft: #4e534b;
      --muted: #5f655c;
      --muted-light: #6b7067;
      --line: #e1dfd7;
      --line-strong: #d2d0c6;
      --accent: #5c6853;
      --accent-deep: #46503f;
      --accent-soft: #e9ece4;
      --accent-faint: #f1f3ed;
      --warm-soft: #eee9e2;
      --danger-soft: #f0e8e3;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --shadow-soft: 0 18px 48px rgba(45, 49, 41, 0.07);
      --shadow-tiny: 0 1px 0 rgba(45, 49, 41, 0.03);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% -5%, rgba(225, 221, 209, 0.42), transparent 32rem),
        radial-gradient(circle at 96% 12%, rgba(229, 232, 223, 0.44), transparent 28rem),
        var(--bg);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body.modal-open { overflow: hidden; }
    a { color: inherit; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    ::selection { background: #dfe4d8; color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .skip-link {
      position: fixed;
      left: 20px;
      top: -80px;
      z-index: 200;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--ink);
      color: white;
      text-decoration: none;
      transition: top 0.2s;
    }
    .skip-link:focus { top: 18px; }

    .app-shell {
      width: min(1180px, calc(100% - 64px));
      margin: 0 auto;
    }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(245, 244, 240, 0.86);
      border-bottom: 1px solid rgba(209, 207, 198, 0.72);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
    }
    .header-inner {
      height: 74px;
      display: flex;
      align-items: center;
      gap: 38px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      flex: none;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.5);
      color: var(--accent-deep);
      font-family: var(--serif);
      font-size: 16px;
      font-style: italic;
      line-height: 1;
    }
    .brand-word {
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .brand-sub {
      margin-left: 2px;
      padding-left: 12px;
      border-left: 1px solid var(--line-strong);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .site-nav {
      display: flex;
      align-self: stretch;
      gap: 30px;
    }
    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 13.5px;
      letter-spacing: 0.01em;
      transition: color 0.2s ease;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: transparent;
      transition: background 0.2s ease;
    }
    .nav-link:hover { color: var(--ink); }
    .nav-link[aria-current="page"] { color: var(--ink); }
    .nav-link[aria-current="page"]::after { background: var(--accent); }
    .header-note {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .header-note::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
    }

    main { min-height: 70vh; }
    .page {
      padding: 46px 0 84px;
      animation: page-in 0.55s var(--ease) both;
    }
    @keyframes page-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Shared page heading ---------- */
    .kicker {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 32px;
    }
    .page-head h1 {
      margin: 0;
      font-size: clamp(36px, 4vw, 48px);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.055em;
    }
    .page-head .page-sub {
      max-width: 540px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.8;
    }
    .page-stats {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: none;
      padding-bottom: 4px;
    }
    .stat {
      min-width: 76px;
      padding: 0 22px;
      border-left: 1px solid var(--line-strong);
    }
    .stat:first-child { padding-left: 0; border-left: 0; }
    .stat:last-child { padding-right: 0; }
    .stat strong {
      display: block;
      color: var(--accent-deep);
      font-family: var(--serif);
      font-size: 31px;
      font-weight: 400;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    /* ---------- Search and filters ---------- */
    .search-shell {
      position: relative;
      display: flex;
      align-items: center;
      height: 60px;
      padding: 0 16px 0 20px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-tiny);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .search-shell:focus-within {
      background: var(--white);
      border-color: #aeb6a5;
      box-shadow: 0 0 0 3px rgba(92, 104, 83, 0.08), var(--shadow-tiny);
    }
    .search-icon {
      width: 19px;
      height: 19px;
      flex: none;
      color: var(--muted);
    }
    .search-shell input {
      width: 100%;
      height: 100%;
      margin-left: 13px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14.5px;
    }
    .search-shell input::placeholder { color: var(--muted-light); }
    .search-clear {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-left: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--bg-deep);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
      flex: none;
    }
    .search-clear:hover { background: #e5e3dc; color: var(--ink); }
    .search-clear[hidden] { display: none; }
    .search-clear svg { width: 13px; height: 13px; }
    .filter-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-soft);
      font-size: 12.5px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .switch-track {
      position: relative;
      width: 38px;
      height: 22px;
      flex: none;
      border-radius: 999px;
      background: #d6d5cd;
      transition: background 0.22s var(--ease);
    }
    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(37, 39, 35, 0.19);
      transition: transform 0.22s var(--ease);
    }
    .switch input:checked + .switch-track { background: var(--accent); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }
    .switch input:focus-visible + .switch-track {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .switch-hint {
      overflow: hidden;
      color: var(--muted-light);
      font-size: 11.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .search-scope {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: -8px 0 22px;
      padding: 10px 13px;
      border: 1px solid #dde2d7;
      border-radius: 10px;
      background: var(--accent-faint);
      color: var(--accent-deep);
      font-size: 11.5px;
      line-height: 1.6;
    }
    .search-scope svg { width: 14px; height: 14px; margin-top: 2px; flex: none; }

    /* ---------- People grid ---------- */
    .people-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .person-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 202px;
      padding: 19px 19px 15px;
      overflow: hidden;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-tiny);
      transition: transform 0.25s var(--ease), background 0.25s, border-color 0.25s, box-shadow 0.25s;
      animation: card-in 0.55s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 28ms);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .person-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(92, 104, 83, 0.4), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .person-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--line-strong);
      box-shadow: var(--shadow-soft);
    }
    .person-card:hover::before { opacity: 1; }
    .person-top {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }
    .avatar {
      display: block;
      object-fit: cover;
      flex: none;
      border-radius: 50%;
      background: var(--bg-deep);
      box-shadow: inset 0 0 0 1px rgba(55, 59, 51, 0.08);
    }
    .avatar-md { width: 52px; height: 52px; }
    .avatar-sm { width: 38px; height: 38px; }
    .avatar-lg { width: 88px; height: 88px; }
    .person-identity { min-width: 0; }
    .person-identity h2 {
      overflow: hidden;
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: 0.005em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .person-identity p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }
    .card-arrow {
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      margin-left: auto;
      flex: none;
      border-radius: 50%;
      color: var(--muted-light);
      opacity: 0;
      transform: translate(-2px, 2px);
      transition: opacity 0.2s, transform 0.25s var(--ease), color 0.2s;
    }
    .card-arrow svg { width: 14px; height: 14px; }
    .person-card:hover .card-arrow {
      opacity: 1;
      transform: translate(0, 0);
      color: var(--accent);
    }
    .card-facts {
      display: grid;
      grid-template-columns: 1fr 1.16fr;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(225, 223, 215, 0.86);
    }
    .card-fact span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted-light);
      font-size: 9.5px;
      letter-spacing: 0.05em;
    }
    .card-fact strong {
      display: block;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .card-foot {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      margin-top: auto;
      padding-top: 15px;
      color: var(--muted-light);
      font-size: 10.5px;
    }
    .rel-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      color: var(--accent);
      white-space: nowrap;
    }
    .rel-meta svg { width: 13px; height: 13px; }
    .rel-meta.is-empty { color: var(--muted-light); }
    .card-note {
      overflow: hidden;
      min-width: 0;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 48px 24px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.34);
      text-align: center;
    }
    .empty-state .empty-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .empty-state .empty-icon svg { width: 21px; height: 21px; }
    .empty-state h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .empty-state p { margin: 7px 0 0; color: var(--muted); font-size: 12.5px; }
    .empty-state .text-button { margin-top: 18px; }

    .text-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s;
    }
    .text-button:hover { color: var(--accent-deep); }
    .text-button svg { width: 13px; height: 13px; }

    /* ---------- Detail ---------- */
    .detail-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 19px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--ink); }
    .back-link svg { width: 14px; height: 14px; }
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink-soft);
      font-size: 11.5px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .ghost-btn:hover {
      background: var(--white);
      border-color: #bfc1b8;
      color: var(--ink);
    }
    .ghost-btn svg { width: 14px; height: 14px; }

    .profile-hero {
      position: relative;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 29px 31px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 90% 10%, rgba(219, 225, 212, 0.6), transparent 20rem),
        rgba(255, 255, 255, 0.62);
      box-shadow: var(--shadow-tiny);
      margin-bottom: 20px;
    }
    .profile-hero::after {
      content: "";
      position: absolute;
      right: -42px;
      bottom: -68px;
      width: 210px;
      height: 210px;
      border: 1px solid rgba(92, 104, 83, 0.1);
      border-radius: 50%;
      pointer-events: none;
    }
    .profile-avatar {
      position: relative;
      flex: none;
    }
    .profile-avatar .avatar-lg {
      width: 96px;
      height: 96px;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.8), inset 0 0 0 1px rgba(55, 59, 51, 0.08);
    }
    .profile-title { min-width: 0; }
    .profile-title h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 43px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
    }
    .profile-sub {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px 10px;
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .profile-sub .dot { color: var(--line-strong); }
    .profile-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .profile-quick span { display: inline-flex; align-items: center; gap: 6px; }
    .profile-quick svg { width: 12px; height: 12px; opacity: 0.8; }
    .profile-rel-count {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      margin-left: auto;
      padding-left: 28px;
      flex: none;
    }
    .profile-rel-count strong {
      color: var(--accent-deep);
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .profile-rel-count span {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10.5px;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 322px;
      align-items: start;
      gap: 20px;
    }
    .detail-main { min-width: 0; }
    .detail-side { min-width: 0; }

    .profile-section {
      margin-bottom: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.56);
      box-shadow: var(--shadow-tiny);
      transition: border-color 0.2s, background 0.2s;
    }
    .profile-section:hover { border-color: #d8d6cd; }
    .profile-section.is-open { background: rgba(255, 255, 255, 0.72); }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 60px;
      padding: 0 16px 0 20px;
    }
    .section-toggle {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-width: 0;
      min-height: 58px;
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }
    .section-toggle.static { cursor: default; }
    .section-no {
      flex: none;
      width: 18px;
      color: var(--muted-light);
      font-family: var(--serif);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .section-title {
      flex: none;
      margin: 0;

    /* ---------- Graph ---------- */
    .graph-page .page-head { margin-bottom: 24px; }

      height: 4px;
      border-radius: 50%;
      background: #f9f8f4;
      border: 1px solid #b9bdb5;

    .graph-tools .switch input:checked + .switch-track::after { transform: translateX(14px); }

      height: clamp(540px, calc(100vh - 300px), 680px);

    }

    .panel-relation .avatar { width: 28px; height: 28px; }
    .panel-relation-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: var(--ink-soft);
      font-size: 11px;
      text-overflow: ellipsis;

    }
    .panel-relation-label {
      flex: none;
      color: var(--accent);

      white-space: nowrap;
    }
    .panel-no-relations {

    }
    .panel-note {

      color: var(--muted);

    /* ---------- Footer ---------- */
    .site-footer {
      border-top: 1px solid rgba(209, 207, 198, 0.72);
      background: rgba(239, 238, 233, 0.42);
    }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      letter-spacing: 0.02em;

      gap: 8px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 13px;
    }

      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--line-strong);
    }
    .footer-note { text-align: right; }

    /* ---------- Dialog / toast ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(35, 38, 32, 0.3);
      backdrop-filter: blur(3px);
      animation: fade-in 0.2s ease both;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      width: min(470px, 100%);
      max-height: calc(100vh - 44px);
      overflow-y: auto;
      padding: 25px;
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      background: var(--surface-solid);
      box-shadow: 0 28px 80px rgba(32, 35, 29, 0.2);
      animation: modal-in 0.36s var(--ease) both;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-head {
      position: relative;
      padding-right: 34px;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -0.035em;
    }
    .modal-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.7;
    }
    .modal-close {
      position: absolute;
      top: -3px;
      right: -3px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
      cursor: pointer;
    }
    .modal-close:hover { background: var(--white); color: var(--ink); }
    .modal-close svg { width: 13px; height: 13px; }
    .modal-form {
      display: grid;
      gap: 15px;
      margin-top: 22px;
    }
    .form-field { display: grid; gap: 7px; }
    .form-field > span {
      color: var(--ink-soft);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      font-size: 12.5px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-field input,
    .form-field select { height: 42px; padding: 0 12px; }
    .form-field textarea { min-height: 82px; padding: 10px 12px; resize: vertical; line-height: 1.65; }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      outline: none;
      border-color: #adb5a4;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(92, 104, 83, 0.08);
    }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: var(--muted-light); }
    .form-field select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #7e8379 50%), linear-gradient(135deg, #7e8379 50%, transparent 50%);
      background-position: calc(100% - 16px) 18px, calc(100% - 11px) 18px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }
    .form-error {
      display: none;
      margin: -3px 0 0;
      color: #9a5f4b;
      font-size: 10.5px;
    }
    .form-error.is-visible { display: block; }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 5px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .btn-primary,
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 17px;
      border-radius: 9px;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-primary {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
    .btn-secondary {
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink-soft);
    }
    .btn-secondary:hover { background: var(--white); color: var(--ink); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 150;
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border: 1px solid rgba(66, 76, 59, 0.6);
      border-radius: 9px;
      background: rgba(49, 56, 44, 0.95);
      color: #f5f4f0;
      font-size: 11.5px;
      line-height: 1.6;
      box-shadow: 0 10px 30px rgba(38, 42, 34, 0.18);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 8px);
      transition: opacity 0.25s, transform 0.3s var(--ease), visibility 0.25s;
    }
    .toast.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .not-found {
      max-width: 520px;
      margin: 40px auto;
      padding: 44px 30px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
    .not-found h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.04em;
    }
    .not-found p { margin: 10px 0 22px; color: var(--muted); font-size: 12px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1020px) {
      .app-shell { width: min(100% - 44px, 900px); }
      .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: minmax(0, 1fr) 292px; }
      .profile-quick span:last-child { display: none; }
    }
    @media (max-width: 820px) {
      .app-shell { width: calc(100% - 36px); }
      .header-inner { height: 66px; gap: 24px; }
      .brand-sub, .header-note { display: none; }
      .site-nav { margin-left: auto; gap: 22px; }
      .page { padding-top: 34px; }
      .page-head { align-items: flex-start; gap: 22px; }
      .page-head h1 { font-size: 37px; }
      .page-stats { display: none; }
      .graph-head-stats { display: none; }
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .relations-card { position: static; }
      .detail-side { margin-top: 8px; }
      .graph-stage { height: 590px; }

    }
    @media (max-width: 660px) {
      .app-shell { width: calc(100% - 28px); }
      .header-inner { gap: 16px; }
      .brand-word { font-size: 21px; }
      .brand-mark { width: 30px; height: 30px; font-size: 14px; }
      .site-nav { gap: 18px; }
      .nav-link { font-size: 12.5px; }
      .page { padding-top: 28px; padding-bottom: 60px; }
      .page-head { margin-bottom: 25px; }
      .page-head h1 { font-size: 34px; }
      .page-head .page-sub { margin-top: 10px; font-size: 12px; }
      .search-shell { height: 54px; padding-left: 15px; }
      .search-shell input { font-size: 13px; }
      .filter-left { display: grid; gap: 3px; }
      .switch-hint { padding-left: 48px; font-size: 10px; }
      .people-grid { grid-template-columns: minmax(0, 1fr); gap: 11px; }
      .person-card { min-height: 190px; }
      .profile-hero { padding: 22px 19px; gap: 16px; border-radius: 18px; }
      .profile-avatar .avatar-lg { width: 76px; height: 76px; }
      .profile-title h1 { font-size: 32px; }
      .profile-sub { font-size: 10.5px; }
      .profile-quick { display: none; }
      .profile-rel-count { padding-left: 6px; }
      .profile-rel-count strong { font-size: 26px; }
      .section-head { padding: 0 11px 0 15px; }
      .section-toggle { gap: 10px; }
      .section-summary { display: none; }
      .section-content { padding: 2px 15px 19px; }
      .detail-fields, .custom-fields { grid-template-columns: minmax(0, 1fr); gap: 15px; }
      .field.wide, .custom-fields .field.wide { grid-column: auto; }
      .social-row { grid-template-columns: 30px minmax(0, 1fr) minmax(0, 64px) auto; gap: 8px; }
      .social-note { max-width: 64px; font-size: 9px; }
      .address-row { gap: 9px; }
      .custom-empty { align-items: flex-start; flex-direction: column; gap: 11px; }
      .graph-toolbar { align-items: flex-start; flex-direction: column; gap: 8px; padding: 12px 14px; }
      .graph-tools { width: 100%; justify-content: space-between; }
      .graph-legend { display: none; }
      .graph-stage { height: 540px; }
      .graph-side-panel {
        top: 9px;
        right: 9px;
        bottom: 9px;
        left: 9px;
        width: auto;
        border-radius: 14px;
      }
      .graph-zoom { left: 10px; bottom: 10px; }
      .footer-inner { min-height: 70px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 5px; }
      .footer-note { text-align: left; }
      .detail-toolbar { align-items: center; }
      .detail-toolbar .ghost-btn { height: 31px; padding: 0 10px; font-size: 10px; }
      .modal { padding: 20px; border-radius: 17px; }
      .modal-head h2 { font-size: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
    /* ---------- v2 additions: CRUD, typed relations, focus mode ---------- */
    [hidden] { display: none !important; }
    .search-row {
      display: flex;
      align-items: stretch;
      gap: 12px;
    }
    .search-row .search-shell {
      flex: 1;
      min-width: 0;
    }
    .add-person-btn {
      display: inline-flex;
      align-items: center;

    .social-status::after {
      content: "⌄";
      margin-left: 2px;
      color: currentColor;
      font-size: 8px;
      line-height: 1;
      opacity: 0.55;
    }
    .social-status:hover {
      filter: brightness(0.97);
      box-shadow: 0 0 0 1px rgba(92, 104, 83, 0.18);
    }
    .social-status.inactive:hover {
      box-shadow: 0 0 0 1px rgba(140, 129, 117, 0.18);
    }
    .social-remove {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      flex: none;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-light);
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
    }
    .social-remove:hover {
      opacity: 1;
      border-color: #e5d6cd;
      background: #fbf5f1;
      color: #8c5b4a;
    }
    .social-remove svg { width: 12px; height: 12px; }
    .social-row:hover .social-remove { opacity: 0.9; }

    .relation-item {
      position: relative;
      border-bottom: 1px solid rgba(225, 223, 215, 0.8);
    }
    .relation-item .relation-person {
      padding-right: 52px;
      border-bottom: 0;
    }
    .relation-action {
      position: absolute;
      top: 50%;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface-solid);
      color: var(--muted-light);
      cursor: pointer;
      opacity: 0;
      transform: translateY(-50%) scale(0.9);
      transition: opacity 0.2s, transform 0.2s var(--ease), color 0.2s, border-color 0.2s, background 0.2s;
    }
    .relation-remove { right: 0; }
    .relation-edit { right: 26px; }
    .relation-action:hover {
      color: var(--accent-deep);
      border-color: var(--accent);
      background: var(--accent-faint);
    }
    .relation-remove:hover {
      color: #8c5b4a;
      border-color: #e2d2c8;
      background: #fbf5f1;
    }
    .relation-action svg { width: 10px; height: 10px; }
    .relation-item:hover .relation-action,
    .relation-item:focus-within .relation-action {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }
    .relation-item:hover .relation-arrow,
    .relation-item:focus-within .relation-arrow { opacity: 0; }

    @media (min-width: 821px) {
      .detail-side {
        position: sticky;
        top: 94px;
      }
      .relations-card { position: static; }
    }

    .custom-field {
      position: relative;
      padding-right: 22px;
    }
    .custom-field-remove {
      position: absolute;
      top: 0;
      right: 0;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--muted-light);
      cursor: pointer;
      opacity: 0.34;
      transition: opacity 0.2s, color 0.2s, background 0.2s, border-color 0.2s;
    }
    .custom-field-remove:hover {
      color: #8c5b4a;
      border-color: #e5d6cd;
      background: #fbf5f1;
      opacity: 1;
    }
    .custom-field-remove svg { width: 10px; height: 10px; }
    .custom-field:hover .custom-field-remove,
    .custom-field:focus-within .custom-field-remove { opacity: 1; }

    @media (hover: none) {
      .relation-action { opacity: 0.75; transform: translateY(-50%) scale(1); }
      .relation-arrow { display: none; }
      .custom-field-remove { opacity: 0.65; }
      .social-remove { opacity: 0.75; }
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .segment {
      position: relative;
      display: block;
      min-width: 0;
      cursor: pointer;
    }
    .segment input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .segment-ui {
      display: block;
      min-height: 57px;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.55);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .segment-ui strong {
      display: block;
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
    }
    .segment-ui small {
      display: block;
      margin-top: 2px;
      color: var(--muted-light);
      font-size: 9px;
      line-height: 1.5;
    }
    .segment input:checked + .segment-ui {
      border-color: #aab5a1;
      background: var(--accent-faint);
      box-shadow: inset 0 0 0 1px rgba(92, 104, 83, 0.18);
    }
    .segment input:focus-visible + .segment-ui {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .form-dependent[hidden] { display: none; }
    .form-dependent {
      display: grid;
      gap: 15px;
    }
    .btn-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 17px;
      border: 1px solid #8d5b4b;
      border-radius: 9px;
      background: #8d5b4b;
      color: #fff;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-danger:hover { background: #744839; border-color: #744839; }
    .confirm-copy {
      margin: 20px 0 0;
      padding: 16px;
      border: 1px solid #eadbd3;
      border-radius: 10px;
      background: #fbf5f1;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.8;
    }
    .confirm-copy strong { color: #7d4e3f; }
    .confirm-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10.5px;
    }

    @media (max-width: 820px) {
      .detail-toolbar-actions { max-width: 100%; }
      .graph-legend { gap: 11px; }
    }
    @media (max-width: 660px) {
      .search-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .add-person-btn { height: 48px; border-radius: 12px; }
      .detail-toolbar { align-items: flex-start; flex-wrap: wrap; gap: 10px; }
      .detail-toolbar-actions { width: 100%; justify-content: flex-start; gap: 6px; }
      .detail-toolbar-actions .ghost-btn { height: 30px; padding: 0 9px; font-size: 9.5px; }
      .form-grid { grid-template-columns: minmax(0, 1fr); }
      .form-field.full { grid-column: auto; }
      .segmented { grid-template-columns: minmax(0, 1fr); }
      .interest-composer { gap: 6px; }
      .interest-add { padding: 0 11px; }
      .relations-add-btn { height: 30px; }
      .avatar-editor { align-items: flex-start; padding: 12px; gap: 12px; }
      .avatar-preview { width: 64px; height: 64px; }
      .social-actions { gap: 2px; }
      .social-remove { width: 22px; height: 22px; }
      .graph-focus-bar {
        top: 10px;
        left: 10px;
        right: 10px;
        justify-content: center;
        padding-left: 8px;
        font-size: 9.5px;
      }
      .graph-focus-bar button { font-size: 9px; }
      .modal.modal-wide { width: 100%; }
      .panel-actions { margin-top: 12px; }
    }
    .empty-state .btn-primary { margin-top: 18px; }
    .graph-stage.is-empty { cursor: default; }
    .graph-empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .bootstrap-state {
      min-height: 52vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bootstrap-state .empty-state { width: min(520px, 100%); }
    .loading-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 4px;
    }
    .loading-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      animation: loading-dot 1s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.12s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.24s; }
    @keyframes loading-dot {
      0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }
    .subsection-head-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .subsection-head-actions > span {
      color: var(--muted-light);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
    }
    .subsection-head-actions .text-button { font-size: 10px; }
    .contact-row .social-main strong { color: var(--ink-soft); }

    /* Graph fullscreen */
    body.graph-fullscreen { overflow: hidden; }
    body.graph-fullscreen .site-header,
    body.graph-fullscreen .site-footer,
    body.graph-fullscreen .graph-page .page-head { display: none; }
    body.graph-fullscreen .graph-page {
      padding: 0;
    }
    body.graph-fullscreen .graph-page > .app-shell {
      width: 100%;
      max-width: none;
      height: 100vh;
    }
    body.graph-fullscreen .graph-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    body.graph-fullscreen .graph-stage {
      flex: 1;
      height: auto;
      min-height: 0;
    }

    /* ==================================================================
       Visual system v3 — modern, quiet, product-grade
       ================================================================== */
    :root {
      --bg: #f7f8fa;
      --bg-deep: #f2f4f7;
      --surface: #ffffff;
      --surface-solid: #ffffff;
      --white: #ffffff;
      --ink: #101828;
      --ink-soft: #344054;
      --muted: #5e6a7b;
      --muted-light: #7f8a9b;
      --line: #eaecf0;
      --line-strong: #e4e7ec;
      --accent: #2f5bea;
      --accent-deep: #2348c8;
      --accent-soft: #eef2ff;
      --accent-faint: #f5f7ff;
      --warm-soft: #fff4ed;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-soft: 0 16px 40px rgba(16, 24, 40, 0.08);
      --shadow-tiny: 0 4px 20px rgba(16, 24, 40, 0.035);
      --shadow-card: 0 4px 20px rgba(16, 24, 40, 0.04), 0 1px 2px rgba(16, 24, 40, 0.02);
      --serif: var(--sans);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 520px at 50% -260px, rgba(255, 255, 255, 0.9), transparent 72%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(47, 91, 234, 0.14); color: var(--ink); }
    :focus-visible { outline: 2px solid rgba(47, 91, 234, 0.55); outline-offset: 3px; }

    .app-shell { width: min(1240px, calc(100% - 80px)); }

    /* Header */
    .site-header {
      background: rgba(247, 248, 250, 0.72);
      border-bottom: 0;
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
    }
    .header-inner { height: 76px; gap: 34px; }
    .brand { gap: 11px; }
    .brand-mark {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(145deg, #4770ff, #2448c8);
      box-shadow: 0 4px 12px rgba(47, 91, 234, 0.22);
      color: #ffffff;
      font-family: var(--sans);
      font-size: 14px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    .brand-word {
      font-family: var(--sans);
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1;
    }
    .brand-sub {
      border-left: 0;
      padding-left: 0;
      margin-left: 3px;
      color: var(--muted-light);
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    .site-nav {
      align-self: center;
      gap: 2px;
      padding: 3px;
      border-radius: 11px;
      background: rgba(16, 24, 40, 0.045);
    }
    .nav-link {
      height: 32px;
      padding: 0 15px;
      border-radius: 8px;
      color: #667085;
      font-size: 12.5px;
      font-weight: 500;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .nav-link::after { display: none; }
    .nav-link:hover { color: var(--ink); background: rgba(255, 255, 255, 0.62); }
    .nav-link[aria-current="page"] {
      color: var(--ink);
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1);
    }
    .header-note {
      margin-left: auto;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.03);
      color: var(--muted);
      font-size: 11px;
    }
    .header-note::before { width: 6px; height: 6px; background: #12b76a; opacity: 1; }

    /* Page canvas */
    main { min-height: 72vh; }
    .page { padding: 64px 0 104px; }
    .page-head { margin-bottom: 40px; gap: 40px; align-items: flex-end; }
    .kicker {
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    .page-head h1 {
      font-family: var(--sans);
      font-size: clamp(42px, 4.5vw, 58px);
      font-weight: 720;
      line-height: 1.02;
      letter-spacing: -0.045em;
    }
    .page-head .page-sub {
      max-width: 520px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.7;
    }
    .page-stats {
      gap: 26px;
      padding: 15px 20px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: var(--shadow-tiny);
    }
    .stat {
      min-width: 0;
      padding: 0;
      border-left: 0;
    }
    .stat:first-child, .stat:last-child { padding: 0; }
    .stat strong {
      font-family: var(--sans);
      color: var(--ink);
      font-size: 25px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .stat span { margin-top: 4px; color: var(--muted-light); font-size: 10.5px; letter-spacing: 0.02em; }

    /* Search + actions */
    .search-row { gap: 12px; }
    .search-shell {
      height: 58px;
      padding: 0 18px 0 20px;
      border: 0;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }
    .search-shell:hover { box-shadow: 0 8px 26px rgba(16, 24, 40, 0.06); }
    .search-shell:focus-within {
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(47, 91, 234, 0.1), 0 8px 26px rgba(16, 24, 40, 0.06);
    }
    .search-icon { color: var(--muted-light); }
    .search-shell input { font-size: 14px; }
    .search-shell input::placeholder { color: #b0b8c4; }
    .search-clear { background: #f2f4f7; }
    .search-clear:hover { background: #eaecf0; }
    .add-person-btn {
      height: 58px;
      padding: 0 22px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(47, 91, 234, 0.2);
      font-size: 12.5px;
      font-weight: 550;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .add-person-btn:hover {
      background: var(--accent-deep);
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 12px 26px rgba(47, 91, 234, 0.26);
    }

    /* Cards */
    .people-grid { gap: 20px; }
    .person-card {
      min-height: 216px;
      padding: 24px;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .person-card::before { display: none; }
    .person-card:hover {
      transform: translateY(-3px) scale(1.012);
      background: #ffffff;
      box-shadow: 0 18px 46px rgba(16, 24, 40, 0.1), 0 2px 6px rgba(16, 24, 40, 0.04);
    }
    .avatar { box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.04); }
    .avatar-md { width: 56px; height: 56px; }
    .person-top { gap: 14px; }
    .person-identity h2 {
      color: var(--ink);
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .person-identity p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .card-arrow { color: var(--muted-light); }
    .card-facts {
      grid-template-columns: 1fr 1.2fr;
      gap: 12px;
      margin-top: 22px;
      padding-top: 0;
      border-top: 0;
    }
    .card-fact span { margin-bottom: 4px; color: var(--muted-light); font-size: 10px; letter-spacing: 0.04em; }
    .card-fact strong { color: var(--ink-soft); font-size: 12px; font-weight: 500; }
    .card-foot { margin-top: auto; padding-top: 20px; gap: 12px; }
    .rel-meta {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-faint);
      color: var(--accent);
      font-size: 10px;
    }
    .rel-meta.is-empty {
      background: #f2f4f7;
      color: var(--muted-light);
    }
    .card-note {
      padding-left: 0;
      border-left: 0;
      color: var(--muted-light);
      font-size: 11.5px;
    }
    .person-card.is-new {
      border: 0;
      box-shadow: 0 0 0 4px rgba(47, 91, 234, 0.1), 0 14px 36px rgba(16, 24, 40, 0.08);
    }

    /* Empty states */
    .empty-state {
      min-height: 320px;
      padding: 64px 28px;
      border: 0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
    }
    .empty-state .empty-icon {
      width: 54px;
      height: 54px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: var(--accent-faint);
      color: var(--accent);
    }
    .empty-state .empty-icon svg { width: 24px; height: 24px; }
    .empty-state h2 { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
    .empty-state p { margin-top: 8px; color: var(--muted); font-size: 12.5px; line-height: 1.7; }
    .empty-state .btn-primary { margin-top: 20px; }
    .empty-state .text-button { margin-top: 18px; }
    .empty-inline {
      padding: 18px;
      border: 0;
      border-radius: 14px;
      background: #f8f9fb;
      color: var(--muted-light);
    }

    /* Detail */
    .detail-toolbar { margin-bottom: 24px; }
    .back-link { color: var(--muted); font-size: 12.5px; }
    .back-link:hover { color: var(--ink); }
    .ghost-btn {
      height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
      color: var(--ink-soft);
      font-size: 11.5px;
      transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .ghost-btn:hover {
      background: #ffffff;
      color: var(--ink);
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 6px 16px rgba(16, 24, 40, 0.08);
    }
    .ghost-btn.is-danger {
      background: #fff7f5;
      color: #b54736;
      box-shadow: none;
    }
    .ghost-btn.is-danger:hover { background: #ffefeb; color: #9f3929; }

    .profile-hero {
      gap: 28px;
      padding: 34px 36px;
      border: 0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
    }
    .profile-hero::after {
      right: -70px;
      bottom: -100px;
      width: 260px;
      height: 260px;
      border-color: rgba(16, 24, 40, 0.035);
    }
    .profile-avatar .avatar-lg {
      width: 104px;
      height: 104px;
      box-shadow: 0 0 0 5px #ffffff, 0 10px 26px rgba(16, 24, 40, 0.08);
    }
    .profile-title h1 {
      font-size: clamp(38px, 4vw, 48px);
      font-weight: 720;
      letter-spacing: -0.045em;
    }
    .profile-sub { margin-top: 11px; color: var(--muted); font-size: 12.5px; }
    .profile-sub .dot { color: #d0d5dd; }
    .profile-quick { margin-top: 14px; gap: 8px 20px; color: var(--muted); font-size: 11.5px; }
    .profile-rel-count { padding-left: 26px; }
    .profile-rel-count strong {
      color: var(--ink);
      font-family: var(--sans);
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .profile-rel-count span { color: var(--muted-light); font-size: 10.5px; }
    .detail-grid { grid-template-columns: minmax(0, 1fr) 344px; gap: 24px; }
    .profile-section {
      margin-bottom: 16px;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .profile-section:hover { border-color: transparent; box-shadow: 0 6px 24px rgba(16, 24, 40, 0.055); }
    .profile-section.is-open { background: #ffffff; }
    .section-head { min-height: 68px; padding: 0 24px 0 26px; }
    .section-toggle { min-height: 66px; gap: 14px; }
    .section-no { width: 20px; color: #b0b8c4; font-family: var(--sans); font-size: 10.5px; }
    .section-title { color: var(--ink); font-size: 16px; font-weight: 650; letter-spacing: -0.015em; }
    .section-summary { color: var(--muted-light); font-size: 11px; }
    .section-chevron { color: #b0b8c4; }
    .field-add {
      height: 28px;
      padding: 0 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted-light);
      font-size: 10px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .field-add:hover { border: 0; background: #f2f4f7; color: var(--ink-soft); transform: scale(1.02); }
    .section-content { padding: 0 26px 28px; }
    .section-content > .section-rule { display: none; }
    .detail-fields { gap: 22px 34px; }
    .field-label {
      margin-bottom: 6px;
      color: var(--muted-light);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .field-value { color: var(--ink-soft); font-size: 13.5px; line-height: 1.65; }
    .field-value .auto-note { color: var(--muted-light); font-size: 9.5px; }
    .field-avatar-value span { color: var(--muted); font-size: 11.5px; }
    .custom-badge {
      height: 17px;
      padding: 0 6px;
      border: 0;
      border-radius: 5px;
      background: var(--accent-faint);
      color: var(--accent);
      font-size: 8.5px;
    }
    .custom-fields { margin-top: 20px; padding-top: 18px; border-top: 0; gap: 22px 34px; }
    .subsection-head { margin: 24px 0 10px; }
    .subsection-head h3 { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; }
    .subsection-head-actions > span { color: var(--muted-light); }
    .subsection-head-actions .text-button { font-size: 10.5px; }

    /* Contact, social, address lists */
    .social-list {
      display: grid;
      gap: 5px;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .social-row {
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8f9fb;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .social-row + .social-row { border-top: 0; }
    .social-row:hover { background: #f5f7fa; box-shadow: 0 2px 10px rgba(16, 24, 40, 0.035); }
    .platform-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      color: var(--ink-soft);
      font-size: 13px;
    }
    .social-main strong { color: var(--ink-soft); font-size: 12px; }
    .social-main span { color: var(--muted); font-size: 11px; }
    .social-note { color: var(--muted-light); font-size: 10px; }
    .social-remove { border: 0; color: var(--muted-light); opacity: 0.55; }
    .social-remove:hover { border: 0; background: #fff1ed; color: #b54736; }
    .address-list { gap: 6px; }
    .address-row {
      gap: 14px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: #f8f9fb;
    }
    .addr-mark { height: 21px; padding: 0 8px; border-radius: 6px; background: var(--accent-faint); color: var(--accent); font-size: 9px; }
    .addr-mark.alt { background: #f2f4f7; color: var(--muted); }
    .addr-kind { color: var(--muted); font-size: 10px; }
    .address-text { color: var(--ink-soft); font-size: 12.5px; }
    .interest-line { gap: 9px 26px; }
    .interest-item { color: var(--ink-soft); font-size: 13px; }
    .interest-item::before { background: var(--accent); opacity: 0.55; }
    .custom-empty {
      padding: 20px;
      border: 0;
      border-radius: 14px;
      background: #f8f9fb;
    }
    .custom-empty p { color: var(--muted); font-size: 11.5px; }
    .custom-empty .ghost-btn { background: #ffffff; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); }

    /* Sidebar */
    .relations-card {
      padding: 22px;
      border: 0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
    }
    .relations-head { padding-bottom: 16px; border-bottom: 0; }
    .relations-head h2 { color: var(--ink); font-size: 15px; font-weight: 650; letter-spacing: -0.015em; }
    .relations-head p { margin-top: 5px; color: var(--muted-light); font-size: 10.5px; }
    .relations-count { background: var(--accent-faint); color: var(--accent); font-weight: 600; }
    .relations-list { gap: 2px; margin-top: 10px; }
    .relation-item { border-bottom: 0; }
    .relation-person {
      margin: 0 -8px;
      padding: 10px 8px;
      border-radius: 12px;
      border-bottom: 0;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .relation-person:hover { background: #f8f9fb; padding-left: 12px; }
    .relation-copy strong { color: var(--ink-soft); font-size: 12.5px; }
    .relation-copy span { color: var(--muted); }
    .relation-kind { color: var(--muted-light); }
    .relation-action { border: 0; background: #ffffff; box-shadow: 0 2px 8px rgba(16, 24, 40, 0.08); }
    .relation-remove:hover { border: 0; background: #fff1ed; color: #b54736; }
    .relations-empty { padding: 24px 2px 14px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .relations-empty strong { color: var(--ink-soft); font-size: 12.5px; font-weight: 600; }
    .relations-foot { margin-top: 18px; padding-top: 0; border-top: 0; }
    .relations-add-btn { height: 36px; margin-bottom: 12px; background: #f8f9fb; box-shadow: none; }
    .relations-add-btn:hover { background: #f2f4f7; }
    .side-note {
      margin-top: 16px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      color: var(--muted-light);
      font-size: 10.5px;
    }

    /* Primary / secondary buttons */
    .btn-primary, .btn-danger {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 550;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      box-shadow: 0 6px 16px rgba(47, 91, 234, 0.2);
    }
    .btn-primary:hover { background: var(--accent-deep); transform: translateY(-1px) scale(1.02); box-shadow: 0 10px 22px rgba(47, 91, 234, 0.26); }
    .btn-secondary {
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      background: #f2f4f7;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-secondary:hover { background: #e9ecf1; color: var(--ink); transform: scale(1.02); }
    .btn-danger { background: #d92d20; box-shadow: 0 6px 16px rgba(217, 45, 32, 0.18); }
    .btn-danger:hover { background: #b42318; transform: translateY(-1px) scale(1.02); box-shadow: 0 10px 22px rgba(217, 45, 32, 0.24); }
    .text-button { color: var(--accent); font-weight: 500; }
    .text-button:hover { color: var(--accent-deep); }

    /* Forms */
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .modal {
      border: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.24);
      padding: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .modal-head h2 { font-size: 26px; font-weight: 680; letter-spacing: -0.04em; }
    .modal-head p { color: var(--muted); font-size: 12.5px; }
    .modal-close {
      border: 0;
      background: #f2f4f7;
      color: var(--muted);
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }
    .modal-close:hover { background: #e9ecf1; color: var(--ink); transform: scale(1.05); }
    .form-field > span { color: var(--ink-soft); font-size: 11px; font-weight: 550; letter-spacing: 0.01em; }
    .form-field input,
    .form-field textarea,
    .form-field select {
      border: 0;
      border-radius: 12px;
      background: #f5f6f8;
      box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.045);
      color: var(--ink);
      font-size: 12.5px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .form-field input,
    .form-field select { height: 44px; padding: 0 13px; }
    .form-field textarea { padding: 12px 13px; }
    .form-field input::placeholder,
    .form-field textarea::placeholder { color: #b0b8c4; }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      background: #ffffff;
      border: 0;
      outline: none;
      box-shadow: 0 0 0 3px rgba(47, 91, 234, 0.13), inset 0 0 0 1px var(--accent);
    }
    .form-field select {
      padding-right: 36px;
      background-image: linear-gradient(45deg, transparent 50%, #667085 50%), linear-gradient(135deg, #667085 50%, transparent 50%);
      background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .form-error { color: #b54736; }
    .avatar-editor {
      border: 0;
      border-radius: 16px;
      background: #f8f9fb;
    }
    .avatar-preview { box-shadow: 0 0 0 4px #ffffff, 0 8px 20px rgba(16, 24, 40, 0.08); }
    .avatar-editor-actions .ghost-btn { background: #ffffff; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.05); }
    .segmented { gap: 10px; }
    .segment-ui {
      border: 0;
      border-radius: 12px;
      background: #f8f9fb;
      box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.045);
    }
    .segment-ui strong { color: var(--ink-soft); font-size: 12px; }
    .segment-ui small { color: var(--muted-light); font-size: 9.5px; }
    .segment input:checked + .segment-ui {
      border: 0;
      background: #ffffff;
      box-shadow: 0 0 0 2px var(--accent), 0 4px 14px rgba(16, 24, 40, 0.06);
    }
    .modal-actions { border-top: 0; padding-top: 18px; margin-top: 4px; }
    .confirm-copy {
      border: 0;
      border-radius: 14px;
      background: #f8f9fb;
      color: var(--ink-soft);
    }
    .confirm-copy strong { color: #b42318; }
    .confirm-copy span { color: var(--muted); }

    /* Graph */
    .graph-page .page-head { margin-bottom: 30px; }
    .graph-head-stats { color: var(--muted); font-size: 11px; }
    .graph-head-stats strong { color: var(--ink); font-family: var(--sans); font-size: 19px; font-weight: 650; }
    .graph-panel {
      border: 0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
    }
    .graph-toolbar {
      min-height: 62px;
      padding: 10px 18px 10px 22px;
      border-bottom: 0;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .graph-legend { color: var(--muted); }
    .graph-stage {
      background-color: #f7f8fa;
      background-image: radial-gradient(circle, #e2e6ed 0.8px, transparent 0.8px);
      background-size: 24px 24px;
    }
    .graph-node { filter: drop-shadow(0 6px 12px rgba(16, 24, 40, 0.08)); }
    .graph-node .node-backdrop { fill: #ffffff; stroke: transparent; }
    .graph-node:hover .node-backdrop,
    .graph-node:focus-visible .node-backdrop { stroke: var(--accent); stroke-width: 1.5; }
    .graph-node .node-name {
      fill: #475467;
      font-size: 12px;
      font-weight: 500;
      stroke: #f7f8fa;
    }
    .graph-edge line { stroke: #aeb8c6; stroke-width: 1.3; }
    .graph-edge .edge-curve { stroke: #aeb8c6; stroke-width: 1.3; }
    .edge-label rect { fill: #ffffff; stroke: none; filter: drop-shadow(0 1px 3px rgba(16, 24, 40, 0.06)); }
    .edge-label text { fill: #4f5b6b; font-size: 10.5px; font-weight: 550; }
    .legend-line { background: #aeb8c6; }
    .legend-line::after { background: #ffffff; border-color: #aeb8c6; }
    .legend-arc { color: #c5cbd5; }
    .legend-arc path + path { stroke: #aeb8c6; }
    .graph-zoom {
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.08);
      backdrop-filter: blur(10px);
    }
    .graph-zoom button { border-top: 0; color: var(--ink-soft); }
    .graph-zoom button:hover { background: #f5f6f8; color: var(--accent); }
    .graph-hint {
      border: 0;
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 10px rgba(16, 24, 40, 0.04);
      color: var(--muted-light);
      backdrop-filter: blur(8px);
    }
    .graph-side-panel {
      border: 0;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 64px rgba(16, 24, 40, 0.18);
      backdrop-filter: blur(18px);
    }
    .panel-close { border: 0; background: #f2f4f7; }
    .panel-profile h2 { font-weight: 650; }
    .panel-facts {
      gap: 9px;
      padding: 14px;
      border-top: 0;
      border-bottom: 0;
      border-radius: 12px;
      background: #f8f9fb;
    }
    .panel-section-head { margin-top: 18px; }
    .panel-relation { border-bottom: 0; border-radius: 9px; padding: 8px 6px; }
    .panel-relation:hover { background: #f5f6f8; }
    .panel-note { color: var(--muted-light); }
    .panel-focus-btn { border: 0; background: #f2f4f7; }
    .panel-focus-btn:hover { border: 0; background: #eaecf0; color: var(--ink-soft); }
    .panel-cta { background: var(--accent); box-shadow: 0 6px 16px rgba(47, 91, 234, 0.2); }
    .panel-cta:hover { background: var(--accent-deep); }
    .graph-focus-bar {
      border: 0;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 22px rgba(16, 24, 40, 0.08);
      backdrop-filter: blur(10px);
    }
    .graph-focus-bar button { border: 0; background: var(--accent-faint); color: var(--accent); }
    .graph-focus-bar button:hover { border: 0; background: var(--accent-soft); }

    /* Footer */
    .site-footer {
      border-top: 0;
      background: transparent;
    }
    .footer-inner { min-height: 88px; color: var(--muted-light); font-size: 10.5px; }
    .footer-brand { color: var(--muted); font-family: var(--sans); font-size: 12px; }
    .footer-brand::before { background: #d0d5dd; }

    /* Misc */
    .toast {
      border: 0;
      border-radius: 11px;
      background: rgba(16, 24, 40, 0.94);
      color: #ffffff;
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.16);
      font-size: 11.5px;
    }
    .not-found {
      border: 0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
    }
    .not-found h1 { font-weight: 680; letter-spacing: -0.03em; }
    .custom-field-remove { border: 0; }
    .custom-field-remove:hover { border: 0; }
    .relation-arrow { color: #b0b8c4; }

    /* Responsive refinements */
    @media (max-width: 1020px) {
      .app-shell { width: min(100% - 48px, 960px); }
      .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-grid { grid-template-columns: minmax(0, 1fr) 310px; }
      .page-stats { gap: 20px; }
    }
    @media (max-width: 820px) {
      .app-shell { width: calc(100% - 40px); }
      .header-inner { height: 68px; gap: 20px; }
      .brand-sub, .header-note { display: none; }
      .site-nav { margin-left: auto; }
      .page { padding: 44px 0 72px; }
      .page-head { margin-bottom: 32px; align-items: flex-start; }
      .page-head h1 { font-size: 40px; }
      .page-stats { display: none; }
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .profile-hero { padding: 28px; }
      .detail-side { margin-top: 8px; }
    }
    @media (max-width: 660px) {
      .app-shell { width: calc(100% - 32px); }
      .header-inner { height: 64px; gap: 12px; }
      .brand-word { font-size: 18px; }
      .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
      .site-nav { padding: 2px; }
      .nav-link { height: 30px; padding: 0 12px; font-size: 12px; }
      .page { padding: 34px 0 64px; }
      .page-head h1 { font-size: 36px; }
      .page-head .page-sub { margin-top: 12px; font-size: 12.5px; }
      .search-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .search-shell { height: 54px; border-radius: 14px; }
      .add-person-btn { height: 48px; border-radius: 13px; }
      .people-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .person-card { min-height: 200px; padding: 20px; border-radius: 18px; }
      .person-card:hover { transform: none; }
      .profile-hero { padding: 22px 20px; gap: 18px; border-radius: 20px; }
      .profile-avatar .avatar-lg { width: 80px; height: 80px; }
      .profile-title h1 { font-size: 34px; }
      .profile-rel-count strong { font-size: 25px; }
      .detail-toolbar { gap: 12px; }
      .detail-toolbar-actions { width: 100%; gap: 6px; }
      .detail-toolbar-actions .ghost-btn { height: 31px; padding: 0 10px; font-size: 10px; }
      .section-head { min-height: 62px; padding: 0 16px 0 18px; }
      .section-toggle { min-height: 60px; gap: 11px; }
      .section-content { padding: 0 18px 22px; }
      .detail-fields, .custom-fields { grid-template-columns: minmax(0, 1fr); gap: 17px; }
      .field.wide, .custom-fields .field.wide { grid-column: auto; }
      .social-row { grid-template-columns: 32px minmax(0, 1fr) minmax(0, 60px) auto; gap: 8px; padding: 11px 12px; }
      .social-note { font-size: 9.5px; }
      .modal { padding: 22px; border-radius: 20px; }
      .modal-head h2 { font-size: 23px; }
      .avatar-editor { padding: 12px; }
      .avatar-preview { width: 64px; height: 64px; }
      .graph-toolbar { align-items: flex-start; flex-direction: column; gap: 8px; padding: 12px 14px; }
      .graph-tools { width: 100%; justify-content: space-between; }
      .graph-legend { display: none; }
      .graph-stage { height: 540px; }
      .graph-side-panel { top: 9px; right: 9px; bottom: 9px; left: 9px; width: auto; border-radius: 16px; }
      .graph-focus-bar { top: 10px; left: 10px; right: 10px; justify-content: center; }
      .footer-inner { min-height: 74px; align-items: flex-start; flex-direction: column; justify-content: center; gap: 4px; }
      .footer-note { text-align: left; }
    }

    /* Fullscreen rules need to win over the refreshed base styles */
    body.graph-fullscreen .site-header,
    body.graph-fullscreen .site-footer,
    body.graph-fullscreen .graph-page .page-head { display: none; }
    body.graph-fullscreen .graph-page { padding: 0; }
    body.graph-fullscreen .graph-page > .app-shell { width: 100%; max-width: none; height: 100vh; }
    body.graph-fullscreen .graph-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    body.graph-fullscreen .graph-stage { flex: 1; height: auto; min-height: 0; }

    /* ==================================================================
       ARCHIVE THEME // paper / ink / seal
       ================================================================== */
    :root {
      --bg: #030603;
      --bg-deep: #010301;
      --surface: #050a06;
      --surface-solid: #050a06;
      --white: #d9ffe4;
      --ink: #d9ffe4;
      --ink-soft: #b7efc5;
      --muted: #74a180;
      --muted-light: #4f7458;
      --line: #15351f;
      --line-strong: #1c4828;
      --accent: #57ff8a;
      --accent-deep: #20df65;
      --accent-soft: rgba(87, 255, 138, 0.1);
      --accent-faint: rgba(87, 255, 138, 0.045);
      --warm-soft: #2c210c;
      --danger: #ff6a6a;
      --danger-soft: rgba(255, 106, 106, 0.09);
      --shadow-soft: 0 0 30px rgba(87, 255, 138, 0.12);
      --shadow-tiny: 0 0 14px rgba(87, 255, 138, 0.05);
      --shadow-card: 0 0 0 1px rgba(87, 255, 138, 0.02), 0 0 22px rgba(87, 255, 138, 0.035);
      --radius-lg: 2px;
      --radius-md: 2px;
      --radius-sm: 2px;
      --mono: "Cascadia Code", "SFMono-Regular", "JetBrains Mono", "IBM Plex Mono", Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace;
      --sans: var(--mono);
      --serif: var(--mono);
    }

    html { color-scheme: dark; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -12%, rgba(87, 255, 138, 0.07), transparent 42%),
        radial-gradient(circle at 90% 88%, rgba(87, 255, 138, 0.035), transparent 30%),
        linear-gradient(rgba(87, 255, 138, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(87, 255, 138, 0.025) 1px, transparent 1px),
        var(--bg);

    /* ==================================================================
       TERMINAL READABILITY CALIBRATION
       Keep the CRT console. Make the text survive long sessions.
       ================================================================== */
    :root {
      --ink: #ebfff2;
      --ink-soft: #d3f6dc;
      --muted: #a4c8ae;
      --muted-light: #86aa90;
      --line: #1d432a;
      --line-strong: #2b5a38;
      --mono: "Cascadia Code", "SFMono-Regular", "JetBrains Mono", "IBM Plex Mono", Consolas, "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", monospace;
      --sans: var(--mono);
      --serif: var(--mono);
    }
    body {
      background:
        radial-gradient(circle at 50% -12%, rgba(87, 255, 138, 0.07), transparent 42%),
        radial-gradient(circle at 90% 88%, rgba(87, 255, 138, 0.035), transparent 30%),
        repeating-linear-gradient(to bottom, rgba(87, 255, 138, 0.018) 0, rgba(87, 255, 138, 0.018) 1px, transparent 1px, transparent 5px),
        linear-gradient(rgba(87, 255, 138, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(87, 255, 138, 0.022) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, auto, 36px 36px, 36px 36px, auto;
      background-attachment: fixed;
      font-family: var(--mono);
      font-size: 14.5px;
      line-height: 1.7;
      -webkit-font-smoothing: auto;
      text-rendering: optimizeLegibility;
    }
    /* CRT texture stays in the canvas, never across the glyphs. */
    body::after { display: none; }

    /* ==================================================================
       DAYLIGHT TERMINAL // light canvas, ink text, signal green
       ================================================================== */
    :root {
      --bg: #f4f6f1;
      --bg-deep: #ecf1eb;
      --surface: #ffffff;
      --surface-solid: #ffffff;
      --white: #ffffff;
      --ink: #17211a;
      --ink-soft: #26352b;
      --muted: #4f6054;
      --muted-light: #5f7064;
      --line: #d8e1d7;
      --line-strong: #c6d4c8;
      --accent: #0b7a54;
      --accent-deep: #075e40;
      --accent-soft: #e6f3ec;
      --accent-faint: #f1f8f4;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --shadow-soft: 0 16px 40px rgba(22, 32, 25, 0.08);
      --shadow-tiny: 0 1px 2px rgba(22, 32, 25, 0.04);
      --shadow-card: 0 1px 2px rgba(22, 32, 25, 0.04), 0 8px 24px rgba(22, 32, 25, 0.035);
      --radius-lg: 2px;
      --radius-md: 2px;
      --radius-sm: 2px;
    }
    html { color-scheme: light; }
    html, body { min-height: 100%; }
    body {
      background:
        linear-gradient(rgba(23, 33, 26, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 26, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px, 48px 48px, auto;
      background-attachment: fixed;
      color: var(--ink);
      caret-color: var(--accent);
      -webkit-font-smoothing: auto;
    }
    body::after { display: none; }
    ::selection { background: var(--accent); color: #ffffff; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    * { scrollbar-width: thin; scrollbar-color: #a9bfaf #f4f6f1; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: #f4f6f1; border-left: 1px solid #e2e9e1; }
    *::-webkit-scrollbar-thumb { background: #a9bfaf; border: 1px solid #c4d4c7; }
    *::-webkit-scrollbar-thumb:hover { background: #8eab96; }

      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(22, 32, 25, 0.02);

      -webkit-backdrop-filter: blur(10px);
    }

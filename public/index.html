            await document.exitFullscreen();
          } catch {
            // Ignore native fullscreen exit failures.
          }
        }
        window.setTimeout(() => graphCtx?.fitView(), 80);
      }

      function toggleGraphFullscreen() {
        if (document.body.classList.contains("graph-fullscreen")) {
          exitGraphFullscreen();
        } else {
          enterGraphFullscreen();
        }
      }

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && document.body.classList.contains("graph-fullscreen")) {
          document.body.classList.remove("graph-fullscreen");
          updateGraphFullscreenButton();
          window.setTimeout(() => graphCtx?.fitView(), 80);
        }
      });

      function renderGraphPage(route) {
        const hasRelations = relations.length > 0;
        const graphPeople = state.graphShowIsolated
          ? people
          : people.filter((person) => connectedIds.has(person.id));
        const graphRelations = relations.filter((relation) =>
          graphPeople.some((person) => person.id === relation.a) &&
          graphPeople.some((person) => person.id === relation.b)
        );
        const graphEmptyHtml = `<div class="graph-empty-state" role="status" aria-label="${people.length ? "暂无关系" : "暂无档案"}">
          <span class="graph-empty-number" aria-hidden="true">${people.length ? "0" : "—"}</span>
          <span class="graph-empty-label" aria-hidden="true">${people.length ? "LINKS" : "RECORDS"}</span>
        </div>`;

        document.getElementById("app").innerHTML = `
          <section class="graph-page page">
            <div class="app-shell">
              <div class="graph-panel">
                <div class="graph-toolbar">
                  <div class="graph-legend" aria-label="关系图图例">
                    <span class="legend-item"><span class="legend-line" aria-hidden="true"></span>对等关系</span>
                    <span class="legend-item">
                      <svg class="legend-arc" viewBox="0 0 24 14" aria-hidden="true"><path d="M2 7 Q12 1 22 7"></path><path d="M2 7 Q12 13 22 7"></path></svg>
                      角色关系</span>
                  </div>
                  <div class="graph-tools">
                    ${hasRelations ? `<label class="switch">
                      <input id="graph-show-isolated" type="checkbox" ${state.graphShowIsolated ? "checked" : ""}>
                      <span class="switch-track" aria-hidden="true"></span>
                      <span>显示独立档案</span>
                    </label>
                    <button class="ghost-btn" id="graph-fit" type="button">${icons.fit} 适应视图</button>` : ""}
                    <button class="ghost-btn" id="graph-fullscreen" type="button" aria-pressed="false">${icons.fullscreen} 全屏</button>
                  </div>
                </div>
                <div class="graph-stage ${hasRelations ? "" : "is-empty"}" id="graph-stage">
                  ${hasRelations ? `<svg id="graph-svg" role="group" aria-label="档案关系图"></svg>
                  <div class="graph-focus-bar" id="graph-focus-bar" hidden>
                    <span class="focus-dot" aria-hidden="true"></span>
                    <span>仅显示：<strong id="graph-focus-name"></strong></span>
                    <button type="button" id="graph-show-all">显示全部</button>
                  </div>
                  <div class="graph-hint">拖拽移动 · 滚轮缩放</div>
                  <div class="graph-zoom" aria-label="缩放控制">
                    <button type="button" data-zoom="in" aria-label="放大">+</button>
                    <button type="button" data-zoom="reset" aria-label="重置缩放" class="zoom-reset">1:1</button>
                    <button type="button" data-zoom="out" aria-label="缩小">-</button>
                  </div>
                  <aside class="graph-side-panel" id="graph-side-panel" aria-hidden="true" aria-label="档案详情侧栏"></aside>` : graphEmptyHtml}
                </div>
              </div>
            </div>
          </section>
        `;

        document.getElementById("graph-fullscreen")?.addEventListener("click", toggleGraphFullscreen);
        updateGraphFullscreenButton();
        if (!hasRelations) return;
        const focusId = route.query.get("person");
        mountGraph(graphPeople, graphRelations, focusId);
      }

      function mountGraph(graphPeople, graphRelations, focusId) {
        const stage = document.getElementById("graph-stage");
        const svg = document.getElementById("graph-svg");
        const panel = document.getElementById("graph-side-panel");
        if (!stage || !svg) return;

        const NS = "http://www.w3.org/2000/svg";
        const make = (tag, attrs = {}, parent) => {
          const element = document.createElementNS(NS, tag);
          Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
          if (parent) parent.appendChild(element);
          return element;
        };

        const visibleIds = new Set(graphPeople.map((person) => person.id));
        const nodes = graphPeople.map((person) => {
          const base = graphPositions[person.id] || { x: 420, y: 320 };
          return { ...person, x: base.x, y: base.y };
        });
        const nodeMap = new Map(nodes.map((node) => [node.id, node]));
        const edges = graphRelations.map((relation) => ({
          ...relation,
          aNode: nodeMap.get(relation.a),
          bNode: nodeMap.get(relation.b)
        })).filter((edge) => edge.aNode && edge.bNode);

        svg.replaceChildren();
        const defs = make("defs", {}, svg);
        nodes.forEach((node, index) => {
          const clip = make("clipPath", { id: `avatar-clip-${index}` }, defs);
          make("circle", { cx: 0, cy: 0, r: 32 }, clip);
        });

        const viewport = make("g", { class: "graph-viewport" }, svg);
        const edgeLayer = make("g", { class: "graph-edges" }, viewport);
        const nodeLayer = make("g", { class: "graph-nodes" }, viewport);

        const appendEdgeLabel = (parent, labelText) => {
          const labelGroup = make("g", { class: "edge-label" }, parent);
          const rect = make("rect", { rx: 5, ry: 5, height: 19 }, labelGroup);
          const text = make("text", { x: 0, y: 0.5 }, labelGroup);
          text.textContent = labelText;
          const bbox = text.getBBox();
          const width = Math.max(bbox.width + 12, 24);
          rect.setAttribute("x", String(-width / 2));
          rect.setAttribute("y", "-9.5");
          rect.setAttribute("width", String(width));
          return { labelGroup, rect, text };
        };

        const edgeElements = edges.map((edge) => {
          const group = make("g", {
            class: `graph-edge ${edge.type === "role" ? "is-role" : "is-peer"}`,
            "data-relation-id": edge.id
          }, edgeLayer);

          if (edge.type === "role") {
            const createArc = (label) => {
              const path = make("path", { class: "edge-curve" }, group);
              const labelParts = appendEdgeLabel(group, label);
              return { path, ...labelParts };
            };
            return {
              ...edge,
              group,
              arcs: [
                { direction: "forward", label: edge.forwardLabel, ...createArc(edge.forwardLabel) },
                { direction: "reverse", label: edge.reverseLabel, ...createArc(edge.reverseLabel) }
              ]
            };
          }

          const line = make("line", {}, group);
          const labelParts = appendEdgeLabel(group, edge.label);
          return { ...edge, group, line, ...labelParts };
        });

        const nodeElements = new Map();
        nodes.forEach((node, index) => {
          const group = make("g", {
            class: "graph-node",
            "data-node-id": node.id,
            tabindex: "0",
            role: "button",
            "aria-label": `${node.name}，${ageText(node.birthDate)}，点击查看档案摘要`
          }, nodeLayer);
          group.setAttribute("transform", `translate(${node.x} ${node.y})`);
          make("circle", { class: "node-backdrop", cx: 0, cy: 0, r: 36.5 }, group);
          make("circle", { class: "node-halo", cx: 0, cy: 0, r: 40.5 }, group);
          make("image", {
            href: avatarData(node),
            x: -32,
            y: -32,
            width: 64,
            height: 64,
            "clip-path": `url(#avatar-clip-${index})`,
            preserveAspectRatio: "xMidYMid slice"
          }, group);
          const title = make("title", {}, group);
          title.textContent = node.name;
          const nameChars = Array.from(node.name);
          const nodeLabel = nameChars.length > 8 ? `${nameChars.slice(0, 7).join("")}…` : node.name;
          const name = make("text", { class: "node-name", y: 53 }, group);
          name.textContent = nodeLabel;
          nodeElements.set(node.id, group);
        });

        const stageRect = stage.getBoundingClientRect();
        const view = { x: 0, y: 0, k: 1 };
        let dragState = null;

        const applyViewport = () => {
          viewport.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
        };

        const NODE_EDGE = 37;
        const ROLE_CURVE = 80;
        const quadraticPoint = (start, control, end, t) => {
          const oneMinus = 1 - t;
          return {
            x: oneMinus * oneMinus * start.x + 2 * oneMinus * t * control.x + t * t * end.x,
            y: oneMinus * oneMinus * start.y + 2 * oneMinus * t * control.y + t * t * end.y
          };
        };

        const arcGeometry = (from, to, bend) => {
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const length = Math.hypot(dx, dy) || 1;
          const perpX = -dy / length;
          const perpY = dx / length;
          const control = {
            x: (from.x + to.x) / 2 + perpX * bend,
            y: (from.y + to.y) / 2 + perpY * bend
          };
          const startLength = Math.hypot(control.x - from.x, control.y - from.y) || 1;
          const endLength = Math.hypot(to.x - control.x, to.y - control.y) || 1;
          const start = {
            x: from.x + ((control.x - from.x) / startLength) * (NODE_EDGE + 1),
            y: from.y + ((control.y - from.y) / startLength) * (NODE_EDGE + 1)
          };
          const end = {
            x: to.x - ((to.x - control.x) / endLength) * (NODE_EDGE + 2),
            y: to.y - ((to.y - control.y) / endLength) * (NODE_EDGE + 2)
          };
          const label = quadraticPoint(start, control, end, 0.5);
          return { start, control, end, label };
        };

        const updateEdgeGeometry = () => {
          edgeElements.forEach((edge) => {
            const a = edge.aNode;
            const b = edge.bNode;

            if (edge.type === "role") {
              edge.arcs.forEach((arc) => {
                const from = arc.direction === "forward" ? a : b;
                const to = arc.direction === "forward" ? b : a;
                const geometry = arcGeometry(from, to, ROLE_CURVE);
                arc.path.setAttribute(
                  "d",
                  `M ${geometry.start.x} ${geometry.start.y} Q ${geometry.control.x} ${geometry.control.y} ${geometry.end.x} ${geometry.end.y}`
                );
                arc.labelGroup.setAttribute("transform", `translate(${geometry.label.x} ${geometry.label.y})`);
              });
              return;
            }

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const length = Math.hypot(dx, dy) || 1;
            const ux = dx / length;
            const uy = dy / length;
            const start = { x: a.x + ux * NODE_EDGE, y: a.y + uy * NODE_EDGE };
            const end = { x: b.x - ux * NODE_EDGE, y: b.y - uy * NODE_EDGE };
            edge.line.setAttribute("x1", String(start.x));
            edge.line.setAttribute("y1", String(start.y));
            edge.line.setAttribute("x2", String(end.x));
            edge.line.setAttribute("y2", String(end.y));
            const midX = (start.x + end.x) / 2;
            const midY = (start.y + end.y) / 2;
            edge.labelGroup.setAttribute("transform", `translate(${midX} ${midY})`);
          });
        };
        updateEdgeGeometry();

        const fitView = (subset = nodes) => {
          const targetNodes = subset.length ? subset : nodes;
          if (!targetNodes.length) return;
          const rect = stage.getBoundingClientRect();
          const width = rect.width;
          const height = rect.height;
          const panelOpen = panel.classList.contains("is-open") && width > 660;
          const usableWidth = panelOpen ? width - 350 : width;
          const padding = Math.min(88, Math.max(48, usableWidth * 0.07));
          const minX = Math.min(...targetNodes.map((node) => node.x)) - 47;
          const maxX = Math.max(...targetNodes.map((node) => node.x)) + 47;
          const minY = Math.min(...targetNodes.map((node) => node.y)) - 52;
          const maxY = Math.max(...targetNodes.map((node) => node.y)) + 70;
          const contentWidth = Math.max(1, maxX - minX);
          const contentHeight = Math.max(1, maxY - minY);
          const k = Math.min((usableWidth - padding * 2) / contentWidth, (height - padding * 2) / contentHeight, 1.35);
          view.k = Math.max(0.36, k);
          view.x = usableWidth / 2 - ((minX + maxX) / 2) * view.k;
          view.y = height / 2 - ((minY + maxY) / 2) * view.k;
          applyViewport();
        };

        const setSelection = (personId) => {
          graphPersonSelection = personId;
          nodeElements.forEach((element, id) => element.classList.toggle("is-selected", id === personId));
          edgeElements.forEach((edge) => {
            const active = Boolean(personId && (edge.aNode.id === personId || edge.bNode.id === personId));
            edge.group.classList.toggle("is-active", active);
            edge.group.classList.toggle("is-dimmed", Boolean(personId && !active));
          });
        };

        const openPanel = (personId) => {
          const person = byId.get(personId);
          if (!person) return;
          panel.innerHTML = graphSidePanelHtml(person);
          panel.classList.add("is-open");
          panel.setAttribute("aria-hidden", "false");
          setSelection(personId);
          panel.querySelector("[data-close-panel]")?.addEventListener("click", () => {
            panel.classList.remove("is-open");
            panel.setAttribute("aria-hidden", "true");
            setSelection(null);
          });
          panel.querySelectorAll("[data-graph-person]").forEach((element) => {
            element.addEventListener("click", () => {
              openPanel(element.dataset.graphPerson);
            });
          });
          panel.querySelector("[data-focus-person]")?.addEventListener("click", () => {
            focusPerson(personId);
          });
        };

        const closePanel = () => {
          panel.classList.remove("is-open");
          panel.setAttribute("aria-hidden", "true");
          setSelection(null);
        };

        const focusBar = document.getElementById("graph-focus-bar");
        const focusName = document.getElementById("graph-focus-name");
        let focusModeId = null;
        let focusModeIds = null;

        const focusPerson = (personId) => {
          const person = byId.get(personId);
          if (!person) return;
          const neighborIds = new Set([personId]);
          edges.forEach((edge) => {
            if (edge.aNode.id === personId) neighborIds.add(edge.bNode.id);
            if (edge.bNode.id === personId) neighborIds.add(edge.aNode.id);
          });
          focusModeId = personId;
          focusModeIds = neighborIds;
          closePanel();
          nodeElements.forEach((element, id) => {
            const keep = neighborIds.has(id);
            element.classList.toggle("is-focus-hidden", !keep);
            element.setAttribute("aria-hidden", String(!keep));
            element.setAttribute("tabindex", keep ? "0" : "-1");
          });
          edgeElements.forEach((edge) => {
            const keep = neighborIds.has(edge.aNode.id) && neighborIds.has(edge.bNode.id);
            edge.group.classList.toggle("is-focus-hidden", !keep);
          });
          if (focusBar) focusBar.hidden = false;
          if (focusName) focusName.textContent = person.name;
          const focusNodes = nodes.filter((node) => neighborIds.has(node.id));
          fitView(focusNodes);
        };

        const clearFocus = () => {
          focusModeId = null;
          focusModeIds = null;
          if (focusBar) focusBar.hidden = true;
          nodeElements.forEach((element) => {
            element.classList.remove("is-focus-hidden");
            element.setAttribute("aria-hidden", "false");
            element.setAttribute("tabindex", "0");
          });
          edgeElements.forEach((edge) => edge.group.classList.remove("is-focus-hidden"));
          setSelection(null);
          fitView();
        };

        const fitCurrentView = () => {
          if (focusModeId && focusModeIds) {
            fitView(nodes.filter((node) => focusModeIds.has(node.id)));
          } else {
            fitView();
          }
        };

        const zoomAt = (factor, clientX, clientY) => {
          const rect = stage.getBoundingClientRect();
          const px = clientX - rect.left;
          const py = clientY - rect.top;
          const nextK = Math.min(2.6, Math.max(0.32, view.k * factor));
          if (nextK === view.k) return;
          const graphX = (px - view.x) / view.k;
          const graphY = (py - view.y) / view.k;
          view.k = nextK;
          view.x = px - graphX * view.k;
          view.y = py - graphY * view.k;
          applyViewport();
        };

        const zoomCenter = (factor) => {
          const rect = stage.getBoundingClientRect();
          zoomAt(factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
        };

        const resetZoom = () => {
          const rect = stage.getBoundingClientRect();
          const targetNodes = focusModeId && focusModeIds
            ? nodes.filter((node) => focusModeIds.has(node.id))
            : nodes;
          if (!targetNodes.length) return;
          const centerX = (Math.min(...targetNodes.map((node) => node.x)) + Math.max(...targetNodes.map((node) => node.x))) / 2;
          const centerY = (Math.min(...targetNodes.map((node) => node.y)) + Math.max(...targetNodes.map((node) => node.y))) / 2;
          view.k = 1;
          view.x = rect.width / 2 - centerX;
          view.y = rect.height / 2 - centerY;
          applyViewport();
        };

        stage.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          if (event.target.closest(".graph-node")) return;
          if (event.target.closest(".graph-zoom") || event.target.closest(".graph-side-panel") || event.target.closest(".graph-focus-bar")) return;
          dragState = {
            type: "pan",
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            originX: view.x,
            originY: view.y
          };
          stage.setPointerCapture(event.pointerId);
          stage.classList.add("is-panning");
        });

        stage.addEventListener("pointermove", (event) => {
          if (!dragState) return;
          if (dragState.type === "pan") {
            view.x = dragState.originX + event.clientX - dragState.startX;
            view.y = dragState.originY + event.clientY - dragState.startY;
            applyViewport();
          } else if (dragState.type === "node") {
            const rect = stage.getBoundingClientRect();
            const pointX = (event.clientX - rect.left - view.x) / view.k;
            const pointY = (event.clientY - rect.top - view.y) / view.k;
            dragState.node.x = pointX - dragState.offsetX;
            dragState.node.y = pointY - dragState.offsetY;
            const element = nodeElements.get(dragState.node.id);
            element?.setAttribute("transform", `translate(${dragState.node.x} ${dragState.node.y})`);
            updateEdgeGeometry();
            if (Math.abs(event.clientX - dragState.startX) + Math.abs(event.clientY - dragState.startY) > 3) {
              dragState.moved = true;
            }
          }
        });

        const endDrag = (event) => {
          if (!dragState) return;
          if (dragState.type === "node") {
            if (!dragState.moved) openPanel(dragState.node.id);
          }
          if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
          stage.classList.remove("is-panning");
          dragState = null;
        };

        stage.addEventListener("pointerup", endDrag);
        stage.addEventListener("pointercancel", endDrag);

        nodeElements.forEach((element, id) => {
          element.addEventListener("pointerdown", (event) => {
            event.stopPropagation();
            if (event.button !== 0) return;
            const node = nodeMap.get(id);
            const rect = stage.getBoundingClientRect();
            const pointX = (event.clientX - rect.left - view.x) / view.k;
            const pointY = (event.clientY - rect.top - view.y) / view.k;
            dragState = {
              type: "node",
              pointerId: event.pointerId,
              node,
              offsetX: pointX - node.x,
              offsetY: pointY - node.y,
              startX: event.clientX,
              startY: event.clientY,
              moved: false
            };
            stage.setPointerCapture(event.pointerId);
            event.preventDefault();
          });
          element.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openPanel(id);
            }
          });
        });

        stage.addEventListener("wheel", (event) => {
          event.preventDefault();
          const factor = Math.exp(-event.deltaY * 0.0014);
          zoomAt(factor, event.clientX, event.clientY);
        }, { passive: false });

        document.querySelectorAll("[data-zoom]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.zoom;
            if (action === "in") zoomCenter(1.18);
            else if (action === "out") zoomCenter(0.85);
            else resetZoom();
          });
        });

        document.getElementById("graph-fit")?.addEventListener("click", fitCurrentView);
        document.getElementById("graph-show-all")?.addEventListener("click", clearFocus);

        document.getElementById("graph-show-isolated")?.addEventListener("change", (event) => {
          state.graphShowIsolated = event.target.checked;
          closePanel();
          renderGraphPage({ query: new URLSearchParams() });
        });

        graphCtx = {
          stage,
          nodes,
          nodeMap,
          view,
          applyViewport,
          fitView: fitCurrentView,
          openPanel,
          closePanel,
          focusPerson,
          clearFocus
        };

        fitView();
        if (focusId && visibleIds.has(focusId)) {
          window.requestAnimationFrame(() => {
            openPanel(focusId);
            fitCurrentView();
          });
        }

        if (!document.querySelector(".graph-side-panel")?.innerHTML) graphPersonSelection = null;
      }

      /* ------------------------------------------------------------------
       * Modal scroll locking
       * ------------------------------------------------------------------ */
      let modalScrollLock = null;

      function lockBodyScroll() {
        if (modalScrollLock) return;
        const scrollbarWidth = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
        const computedPadding = parseFloat(window.getComputedStyle(document.body).paddingRight) || 0;
        modalScrollLock = {
          paddingRight: document.body.style.paddingRight,
          scrollbarWidth
        };
        if (scrollbarWidth > 0) {
          document.body.style.paddingRight = `${computedPadding + scrollbarWidth}px`;
        }
        document.body.classList.add("modal-open");
      }

      function unlockBodyScroll() {
        if (!modalScrollLock) {
          document.body.classList.remove("modal-open");
          return;
        }
        document.body.style.paddingRight = modalScrollLock.paddingRight;
        document.body.classList.remove("modal-open");
        modalScrollLock = null;
      }

      function closeModal() {
        const root = document.getElementById("modal-root");
        if (!root) return;
        root.innerHTML = "";
        unlockBodyScroll();
        if (modalLastFocus && typeof modalLastFocus.focus === "function") {
          modalLastFocus.focus({ preventScroll: true });
        }
        modalLastFocus = null;
      }

      function openModalShell({ kicker, title, description, bodyHtml, wide = false }) {
        modalLastFocus = document.activeElement;
        const root = document.getElementById("modal-root");
        root.innerHTML = `<div class="modal-backdrop" data-modal-backdrop>
          <section class="modal ${wide ? "modal-wide" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
            <div class="modal-head">
              <p class="kicker">${esc(kicker)}</p>
              <button class="modal-close" type="button" data-close-modal aria-label="关闭">${icons.close}</button>
            </div>
            ${bodyHtml}
          </section>
        </div>`;
        lockBodyScroll();
        root.querySelectorAll("[data-close-modal]").forEach((button) => button.addEventListener("click", closeModal));
        root.querySelector("[data-modal-backdrop]")?.addEventListener("click", (event) => {
          if (event.target === event.currentTarget) closeModal();
        });
        return root;
      }

      function setModalError(element, message) {
        if (!element) return;
        element.textContent = message;
        element.classList.toggle("is-visible", Boolean(message));
      }

      function openPersonForm(mode = "create", existingPerson = null) {
        const isEdit = mode === "edit" && existingPerson;
        const person = existingPerson || null;
        const initialAvatar = person?.avatar || generatedAvatarData(person?.name || "");
        const body = `<form class="modal-form" id="person-form" novalidate>
          <div class="avatar-editor">
            <img class="avatar avatar-preview" id="avatar-preview" src="${initialAvatar}" alt="头像预览" width="76" height="76">
            <div class="avatar-editor-copy">

            </div>

          </div>
          <div class="form-grid">
            <label class="form-field">
              <span>姓名</span>
              <input name="name" type="text" maxlength="80" autocomplete="off" value="${esc(person?.name || "")}">
            </label>
            <label class="form-field">
              <span>性别</span>
              <select name="gender">
                <option value="" ${!person?.gender ? "selected" : ""}>未选择</option>
                <option value="女" ${person?.gender === "女" ? "selected" : ""}>女</option>
                <option value="男" ${person?.gender === "男" ? "selected" : ""}>男</option>
              </select>
            </label>
            <label class="form-field date-field">
              <span>出生日期</span>
              <input name="birthDate" type="text" autocomplete="off" value="${esc(person?.birthDate || "")}" aria-label="出生日期">
            </label>
            <label class="form-field">
              <span>身份证号</span>
              <input name="idCard" type="text" maxlength="18" spellcheck="false" autocomplete="off" value="${esc(person?.idCard || "")}">
            </label>
            <p class="id-card-assist" id="id-card-assist" hidden aria-live="polite"></p>
            <label class="form-field full">
              <span>备注</span>
              <textarea name="note" maxlength="320">${esc(person?.note || "")}</textarea>
            </label>
          </div>
          <p class="form-error" id="person-form-error">请填写姓名以继续。</p>
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close-modal>取消</button>
            <button class="btn-primary" type="submit">${isEdit ? "保存更改" : "创建档案"}</button>
          </div>
        </form>`;
        const root = openModalShell({
          kicker: isEdit ? "EDIT PROFILE" : "NEW PROFILE",
          title: isEdit ? "编辑档案" : "新建档案",
          bodyHtml: body,
          wide: true
        });
        const form = document.getElementById("person-form");
        const error = document.getElementById("person-form-error");
        const nameInput = form.elements.name;
        const avatarPreview = document.getElementById("avatar-preview");
        const idCardInput = form.elements.idCard;
        const birthInput = form.elements.birthDate;
        const genderSelect = form.elements.gender;
        const idAssist = document.getElementById("id-card-assist");
        let idCardInfo = null;
        let idLookupToken = 0;

        const setIdAssist = (message, warning = false) => {
          const lines = (Array.isArray(message) ? message : [message]).filter(Boolean);
          idAssist.replaceChildren(...lines.map((line) => {
            const row = document.createElement("span");
            row.className = "id-assist-line";
            row.textContent = line;
            return row;
          }));
          idAssist.hidden = !lines.length;
          idAssist.classList.toggle("is-warning", Boolean(lines.length && warning));
        };

        const renderIdAssist = () => {
          if (!idCardInfo) {
            setIdAssist("");
            return;
          }
          const rawBirthDate = birthInput.value.trim();
          const currentBirthDate = rawBirthDate ? parseBirthDateValue(rawBirthDate) : "";
          const birthConflict = Boolean(rawBirthDate) && currentBirthDate !== idCardInfo.birthDate;
          const genderConflict = Boolean(genderSelect.value) && genderSelect.value !== idCardInfo.gender;
          if (!rawBirthDate) birthInput.value = idCardInfo.birthDate;
          if (!genderSelect.value) genderSelect.value = idCardInfo.gender;

          const address = (person?.addresses || []).find((item) => item.kind === "户口所在地");
          const regionKey = (idCardInfo.regionParts || []).slice(1).pop() || "";
          const regionConflict = Boolean(
            idCardInfo.regionLoaded
            && regionKey
            && address
            && !address.text.includes(regionKey)
          );

          const messages = [];
          if (birthConflict) messages.push("身份证号中的出生日期与已填出生日期不一致。");
          if (genderConflict) messages.push("身份证号中的性别与已填性别不一致。");
          if (idCardInfo.regionLoaded) {
            messages.push(idCardInfo.region
              ? `首次申领户籍地：${idCardInfo.region}`
              : "首次申领户籍地未能识别。");
            if (regionConflict) messages.push("与已有户口所在地不一致，请核对。");
          } else {
            messages.push("正在识别首次申领户籍地…");
          }
          if (!birthConflict && !genderConflict) messages.push("出生日期、性别与身份证号一致。");
          setIdAssist(messages, birthConflict || genderConflict || regionConflict);
        };

        const lookupIdCard = async () => {
          const value = idCardInput.value.trim().toUpperCase();
          const token = ++idLookupToken;
          if (!/^\d{17}[\dX]$/.test(value)) {
            idCardInfo = null;
            setIdAssist("");
            return;
          }
          if (!isValidChineseIdCard(value)) {
            idCardInfo = null;
            setIdAssist("身份证号校验未通过。", true);
            return;
          }
          idCardInfo = {
            birthDate: `${value.slice(6, 10)}-${value.slice(10, 12)}-${value.slice(12, 14)}`,
            gender: Number(value[16]) % 2 === 1 ? "男" : "女",
            region: "",
            regionParts: [],
            regionPrecision: "unknown",
            regionLoaded: false
          };
          renderIdAssist();
          try {
            const details = await apiRequest(`/api/id-card?value=${encodeURIComponent(value)}`);
            if (token !== idLookupToken) return;
            idCardInfo = { ...idCardInfo, ...details, regionLoaded: true };
          } catch {
            if (token !== idLookupToken) return;
            idCardInfo = { ...idCardInfo, regionLoaded: true };
          }
          renderIdAssist();
        };

        idCardInput.addEventListener("input", lookupIdCard);
        birthInput.addEventListener("input", renderIdAssist);
        birthInput.addEventListener("blur", () => {
          const normalized = parseBirthDateValue(birthInput.value);
          if (normalized) birthInput.value = normalized;
          renderIdAssist();
        });
        genderSelect.addEventListener("change", renderIdAssist);
        if (idCardInput.value.trim().length === 18) lookupIdCard();
        const avatarFile = document.getElementById("avatar-file");
        const resetAvatar = document.getElementById("reset-avatar");
        const changeAvatar = document.getElementById("change-avatar");
        let pendingAvatar = person?.avatar || null;

        const refreshAvatarPreview = () => {
          avatarPreview.src = pendingAvatar || generatedAvatarData(nameInput.value);
          resetAvatar.hidden = !pendingAvatar;
        };

        nameInput.addEventListener("input", () => {
          if (!pendingAvatar) refreshAvatarPreview();
        });

        changeAvatar.addEventListener("click", () => avatarFile.click());
        avatarFile.addEventListener("change", () => {
          const file = avatarFile.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            showToast("请选择有效的图片文件。");
            avatarFile.value = "";
            return;
          }
          if (file.size > 8 * 1024 * 1024) {
            showToast("图片大小不能超过 8 MB。");
            avatarFile.value = "";
            return;
          }

          const objectUrl = URL.createObjectURL(file);
          const image = new Image();
          image.addEventListener("load", () => {
            const side = Math.min(image.naturalWidth, image.naturalHeight);
            const sourceX = (image.naturalWidth - side) / 2;
            const sourceY = (image.naturalHeight - side) / 2;
            const canvas = document.createElement("canvas");
            canvas.width = 200;
            canvas.height = 200;
            const context = canvas.getContext("2d");
            context.fillStyle = "#f5f4f0";
            context.fillRect(0, 0, 200, 200);
            context.drawImage(image, sourceX, sourceY, side, side, 0, 0, 200, 200);
            pendingAvatar = canvas.toDataURL("image/jpeg", 0.8);
            URL.revokeObjectURL(objectUrl);
            refreshAvatarPreview();
            avatarFile.value = "";
          });
          image.addEventListener("error", () => {
            URL.revokeObjectURL(objectUrl);
            showToast("无法读取图片，请重试。");
            avatarFile.value = "";
          });
          image.src = objectUrl;
        });
        resetAvatar.addEventListener("click", () => {
          pendingAvatar = null;
          refreshAvatarPreview();
        });

        window.requestAnimationFrame(() => nameInput.focus());

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = form.elements.name.value.trim();
          const gender = form.elements.gender.value;
          const rawBirthDate = form.elements.birthDate.value.trim();
          const birthDate = parseBirthDateValue(rawBirthDate);
          const idCard = form.elements.idCard.value.trim().toUpperCase();
          const note = form.elements.note.value.trim();
          const submitButton = form.querySelector('button[type="submit"]');

          if (!name) {
            setModalError(error, "请填写姓名以继续。");
            nameInput.focus();
            return;
          }
          if (rawBirthDate && birthDate === null) {
            setModalError(error, "请填写正确的出生日期。");
            form.elements.birthDate.focus();
            return;
          }
          if (idCard && !isValidChineseIdCard(idCard)) {
            setModalError(error, "请填写正确的身份证号。");
            form.elements.idCard.focus();
            return;
          }
          if (birthDate) form.elements.birthDate.value = birthDate;
          form.elements.idCard.value = idCard;
          setModalError(error, "");
          submitButton.disabled = true;

          try {
            if (isEdit) {
              const draft = draftPerson(person);
              Object.assign(draft, {
                name,
                gender,
                birthDate,
                idCard,
                note,
                avatar: pendingAvatar
              });
              await persistPersonDraft(draft);
              await loadData();
              closeModal();
              const fresh = byId.get(person.id);
              if (fresh) {
                const scrollY = window.scrollY;
                renderDetailPage(fresh, { preserveScroll: true });
                window.scrollTo({ top: scrollY, behavior: "auto" });
                document.title = `Profiles · ${fresh.name}`;
                showToast("档案已更新。");
              }
              return;
            }

            const created = await apiRequest("/api/people", {
              method: "POST",
              body: JSON.stringify({
                name,
                gender,
                birthDate,
                idCard,
                note,
                contacts: [],
                avatar: pendingAvatar,
                socials: [],
                addresses: [],
                companies: [],
                photos: [],
                interests: [],
                customFields: []
              })
            });
            await loadData();
            closeModal();
            state.query = "";
            state.graphShowIsolated = true;
            state.highlightPersonId = String(created.id);
            renderPeoplePage();
            showToast("档案已创建。");
          } catch (requestError) {
            setModalError(error, requestError.message || "保存失败，请稍后重试。");
            if (document.body.contains(submitButton)) submitButton.disabled = false;
          }
        });
      }

      function openSocialAccountModal(person, editIndex = -1) {
        const existing = editIndex >= 0 ? person.socials[editIndex] : null;
        const isEdit = Boolean(existing);
        const body = `<form class="modal-form" id="social-form" novalidate>
          <div class="form-grid">
            <label class="form-field">
              <span>平台名</span>
              <input name="socialPlatform" type="text" maxlength="24" autocomplete="off" value="${esc(existing?.platform || "")}">
            </label>
            <label class="form-field">
              <span>账号名</span>
              <input name="socialHandle" type="text" maxlength="48" autocomplete="off" value="${esc(existing?.handle || "")}">
            </label>
            <label class="form-field full">
              <span>备注</span>
              <input name="socialNote" type="text" maxlength="60" autocomplete="off" value="${esc(existing?.note || "")}">
            </label>
          </div>
          <p class="form-error" id="social-form-error">请输入平台与账号名称以继续。</p>
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close-modal>取消</button>
            <button class="btn-primary" type="submit">保存</button>
          </div>
        </form>`;
        openModalShell({
          kicker: isEdit ? "EDIT SOCIAL" : "NEW SOCIAL",
          title: isEdit ? "编辑社交账号" : "添加社交账号",
          bodyHtml: body
        });
        const form = document.getElementById("social-form");
        const error = document.getElementById("social-form-error");
        const platformInput = form.elements.socialPlatform;
        const handleInput = form.elements.socialHandle;
        window.requestAnimationFrame(() => platformInput.focus());
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const platform = platformInput.value.trim();
          const handle = handleInput.value.trim();
          if (!platform || !handle) {
            setModalError(error, "请输入平台与账号名称以继续。");
            (!platform ? platformInput : handleInput).focus();
            return;
          }
          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          try {
            const draft = draftPerson(person);
            const nextSocial = {
              platform,
              handle,
              note: form.elements.socialNote.value.trim()
            };
            if (isEdit) draft.socials[editIndex] = nextSocial;
            else draft.socials.push(nextSocial);
            await persistPersonDraft(draft);
            await loadData();
            closeModal();
            state.expandedSections.add("contact");
            const fresh = byId.get(person.id);
            if (fresh) {
              const scrollY = window.scrollY;
              renderDetailPage(fresh, { preserveScroll: true });
              window.scrollTo({ top: scrollY, behavior: "auto" });
            }
            showToast(isEdit ? "社交账号已更新。" : "社交账号已添加。");
          } catch (requestError) {
            setModalError(error, requestError.message || "保存失败，请稍后重试。");
            if (document.body.contains(submitButton)) submitButton.disabled = false;
          }
        });
      }

      function openRelationModal(person, relationId = null) {
        const relation = relationId ? relations.find((item) => item.id === String(relationId)) : null;
        const isEdit = Boolean(relation);
        const other = isEdit ? byId.get(relation.a === person.id ? relation.b : relation.a) : null;
        if (isEdit && !other) {
          showToast("未找到该关系。");
          return;
        }
        const available = isEdit
          ? []
          : people
            .filter((candidate) => candidate.id !== person.id && !relationExists(person.id, candidate.id))
            .sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
        if (!isEdit && !available.length) {
          showToast("暂无可关联的档案。");
          return;
        }
        const targetOption = (candidate) =>
          `<option value="${candidate.id}">${esc(candidate.name)} · ${esc(candidate.phone || "未填写")}</option>`;
        const options = isEdit
          ? `<option value="${other.id}" selected>${esc(other.name)} · ${esc(other.phone || "未填写")}</option>`
          : available.map(targetOption).join("");
        const initialType = relation?.type === "role" ? "role" : "peer";
        const peerLabel = relation?.type === "peer" ? relation.label : "";
        const personIsA = !relation || person.id === relation.a;
        const forwardLabel = relation?.type === "role"
          ? (personIsA ? relation.forwardLabel : relation.reverseLabel)
          : "";
        const reverseLabel = relation?.type === "role"
          ? (personIsA ? relation.reverseLabel : relation.forwardLabel)
          : "";
        const body = `<form class="modal-form" id="relation-form" novalidate>
          <label class="form-field">
            <span>关联档案</span>
            <select name="target" ${isEdit ? "disabled" : ""}>${options}</select>
          </label>
          <div class="form-field">
            <span>关系类型</span>
            <div class="segmented" role="radiogroup" aria-label="关系类型">
              <label class="segment">
                <input type="radio" name="relationType" value="peer" ${initialType === "peer" ? "checked" : ""}>
                <span class="segment-ui"><strong>对等关系</strong><small>双方称呼相同，图上为一条直线</small></span>
              </label>
              <label class="segment">
                <input type="radio" name="relationType" value="role" ${initialType === "role" ? "checked" : ""}>
                <span class="segment-ui"><strong>角色关系</strong><small>双方称呼不同，图上为两条弯曲弧线</small></span>
              </label>
            </div>
          </div>
          <div class="form-dependent" data-peer-fields>
            <label class="form-field">
              <span>关系称呼</span>
              <input name="peerLabel" type="text" maxlength="24" autocomplete="off" value="${esc(peerLabel)}">
            </label>
          </div>
          <div class="form-dependent" data-role-fields hidden>
            <label class="form-field">
              <span>正向称呼（你如何称呼对方）</span>
              <input name="forwardLabel" type="text" maxlength="24" autocomplete="off" value="${esc(forwardLabel)}">
            </label>
            <label class="form-field">
              <span>反向称呼（对方如何称呼你）</span>
              <input name="reverseLabel" type="text" maxlength="24" autocomplete="off" value="${esc(reverseLabel)}">
            </label>
          </div>
          <p class="form-error" id="relation-form-error">请输入关系称呼以继续。</p>
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close-modal>取消</button>
            <button class="btn-primary" type="submit">保存关系</button>
          </div>
        </form>`;
        openModalShell({
          kicker: isEdit ? "EDIT RELATION" : "NEW RELATION",
          title: isEdit ? "编辑关系" : "新建关系",
          bodyHtml: body,
          wide: true
        });
        const form = document.getElementById("relation-form");
        const error = document.getElementById("relation-form-error");
        const peerFields = form.querySelector("[data-peer-fields]");
        const roleFields = form.querySelector("[data-role-fields]");
        const updateType = () => {
          const type = form.elements.relationType.value;
          peerFields.hidden = type !== "peer";
          roleFields.hidden = type !== "role";
          setModalError(error, "");
        };
        form.querySelectorAll('input[name="relationType"]').forEach((radio) => {
          radio.addEventListener("change", updateType);
        });
        updateType();
        window.requestAnimationFrame(() => {
          if (!isEdit) {
            form.elements.target.focus();
            return;
          }
          if (initialType === "role") form.elements.forwardLabel.focus();
          else form.elements.peerLabel.focus();
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const targetId = isEdit ? other.id : form.elements.target.value;
          const type = form.elements.relationType.value;
          if (!isEdit) {
            if (!targetId || targetId === person.id) {
              setModalError(error, "请选择要关联的档案。");
              return;
            }
            if (relationExists(person.id, targetId)) {
              setModalError(error, "这段关系已存在。");
              return;
            }
          }
          let payload;
          if (type === "peer") {
            const label = form.elements.peerLabel.value.trim();
            if (!label) {
              setModalError(error, "请输入关系称呼以继续。");
              form.elements.peerLabel.focus();
              return;
            }
            payload = { type: "peer", label };
          } else {
            const forwardInput = form.elements.forwardLabel.value.trim();
            const reverseInput = form.elements.reverseLabel.value.trim();
            if (!forwardInput || !reverseInput) {
              setModalError(error, "请输入正向与反向称呼以继续。");
              (!forwardInput ? form.elements.forwardLabel : form.elements.reverseLabel).focus();
              return;
            }
            const swap = isEdit && !personIsA;
            payload = {
              type: "role",
              forwardLabel: swap ? reverseInput : forwardInput,
              reverseLabel: swap ? forwardInput : reverseInput
            };
          }
          if (!isEdit) {
            payload.a = person.id;
            payload.b = targetId;
          }
          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          try {
            await apiRequest(isEdit ? `/api/relations/${relation.id}` : "/api/relations", {
              method: isEdit ? "PUT" : "POST",
              body: JSON.stringify(payload)
            });
            await loadData();
            closeModal();
            const fresh = byId.get(person.id);
            if (fresh) {
              const scrollY = window.scrollY;
              renderDetailPage(fresh, { preserveScroll: true });
              window.scrollTo({ top: scrollY, behavior: "auto" });
            }
            showToast(isEdit ? "关系已更新。" : "关系已建立。");
          } catch (requestError) {
            setModalError(error, requestError.message || "保存失败，请稍后重试。");
            if (document.body.contains(submitButton)) submitButton.disabled = false;
          }
        });
      }

      function openDeletePersonModal(person) {
        const relationCount = relationCounts.get(person.id) || 0;
        const body = `<div class="confirm-copy">
            <strong>确认删除这份档案？</strong>
            <span>「${esc(person.name)}」及 ${relationCount} 条关联关系将被永久删除，此操作无法撤销。</span>
          </div>
          <div class="modal-actions">
            <button class="btn-secondary" type="button" data-close-modal>取消</button>
            <button class="btn-danger" type="button" data-confirm-delete>删除档案</button>
          </div>`;
        const root = openModalShell({
          kicker: "DELETE PROFILE",
          title: "删除档案",
          bodyHtml: body
        });
        root.querySelector("[data-confirm-delete]")?.addEventListener("click", async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          try {
            await apiRequest(`/api/people/${person.id}`, { method: "DELETE" });
            await loadData();
            closeModal();
            state.highlightPersonId = null;
            state.query = "";
            showToast("档案已删除。");
            window.location.hash = "#/people";
          } catch (requestError) {
            showToast(requestError.message || "删除失败，请稍后重试。");
            button.disabled = false;
          }
        });
      }

      function openCustomFieldModal(target = "standalone", editFieldId = null) {
        const person = byId.get(state.currentDetailId);
        if (!person) return;
        const existing = editFieldId
          ? (person.customFields || []).find((fieldItem) => fieldItem.id === editFieldId) || null
          : null;
        const isEdit = Boolean(existing);
        const targetValue = (existing?.target || target) === "standalone"
          ? "standalone"
          : (existing?.target || target);
        state.modalTarget = targetValue;
        modalLastFocus = document.activeElement;
        const option = (value, label) => `<option value="${value}" ${targetValue === value ? "selected" : ""}>${label}</option>`;
        const root = document.getElementById("modal-root");
        root.innerHTML = `<div class="modal-backdrop" data-modal-backdrop>
          <section class="modal" role="dialog" aria-modal="true" aria-label="${isEdit ? "编辑自定义字段" : "添加自定义字段"}">
            <div class="modal-head">
              <p class="kicker">${isEdit ? "EDIT FIELD" : "NEW FIELD"}</p>
              <button class="modal-close" type="button" data-close-modal aria-label="关闭">${icons.close}</button>
            </div>
            <form class="modal-form" id="custom-field-form" novalidate>
              <label class="form-field">
                <span>字段名称</span>
                <input name="fieldName" type="text" maxlength="24" autocomplete="off" required value="${esc(existing?.name || "")}">
              </label>
              <label class="form-field">
                <span>字段内容</span>
                <textarea name="fieldValue" maxlength="240" required>${esc(existing?.value || "")}</textarea>
              </label>
              <label class="form-field">
                <span>所属区块</span>
                <select name="fieldTarget">
                  ${option("basic", "基本信息")}
                  ${option("contact", "联系与账号")}
                  ${option("address", "地址")}
                  ${option("interests", "兴趣与描述")}
                  ${option("standalone", "单独展示")}
                </select>
              </label>
              <p class="form-error" id="form-error">请输入字段名称与内容以继续。</p>
              <div class="modal-actions">
                <button class="btn-secondary" type="button" data-close-modal>取消</button>
                <button class="btn-primary" type="submit">保存</button>
              </div>
            </form>
          </section>
        </div>`;
        lockBodyScroll();

        const form = document.getElementById("custom-field-form");
        const nameInput = form.elements.fieldName;
        window.requestAnimationFrame(() => nameInput.focus());

        root.querySelectorAll("[data-close-modal]").forEach((button) => button.addEventListener("click", closeModal));
        root.querySelector("[data-modal-backdrop]")?.addEventListener("click", (event) => {
          if (event.target === event.currentTarget) closeModal();
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = nameInput.value.trim();
          const value = form.elements.fieldValue.value.trim();
          const target = form.elements.fieldTarget.value;
          const error = document.getElementById("form-error");
          if (!name || !value) {
            error.classList.add("is-visible");
            (!name ? nameInput : form.elements.fieldValue).focus();
            return;
          }
          error.classList.remove("is-visible");
          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          try {
            const draft = draftPerson(person);
            const nextField = {
              id: existing?.id || `cf-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 5)}`,
              name,
              value,
              target
            };
            if (isEdit) {
              const index = draft.customFields.findIndex((fieldItem) => fieldItem.id === existing.id);
              if (index !== -1) draft.customFields[index] = nextField;
            } else {
              draft.customFields.push(nextField);
            }
            await persistPersonDraft(draft);
            await loadData();
            const sectionKey = target === "standalone" ? "custom" : target;
            state.expandedSections.add(sectionKey);
            closeModal();
            const fresh = byId.get(person.id);
            if (fresh) {
              const scrollY = window.scrollY;
              renderDetailPage(fresh, { preserveScroll: true });
              window.scrollTo({ top: scrollY, behavior: "auto" });
              window.requestAnimationFrame(() => {
                document.querySelector(`[data-section="${sectionKey}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
              });
            }
            showToast(isEdit ? "字段已更新。" : "字段已保存。");
          } catch (requestError) {
            error.textContent = requestError.message || "保存失败，请稍后重试。";
            error.classList.add("is-visible");
            if (document.body.contains(submitButton)) submitButton.disabled = false;
          }
        });
      }

      /* ------------------------------------------------------------------
       * Routing
       * ------------------------------------------------------------------ */
      function parseRoute() {
        const raw = window.location.hash.replace(/^#/, "") || "/people";
        const [pathPart, queryPart = ""] = raw.split("?");
        const segments = pathPart.split("/").filter(Boolean);
        const query = new URLSearchParams(queryPart);
        if (segments[0] === "person" && segments[1]) {
          return { name: "person", id: decodeURIComponent(segments[1]), query };
        }
        if (segments[0] === "graph") return { name: "graph", query };
        if (segments[0] === "people") return { name: "people", query };
        return { name: "not-found", query };
      }

      function updateNav(active) {
        document.querySelectorAll("[data-nav]").forEach((link) => {
          if (link.dataset.nav === active) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      let appReady = false;

      function renderBootLoading() {
        document.getElementById("app").innerHTML = `<section class="page"><div class="app-shell"><div class="bootstrap-state"><div class="empty-state">
          <span class="empty-icon" aria-hidden="true">${icons.userPlus}</span>
          <h2>正在载入档案<span class="loading-dots"><span></span><span></span><span></span></span></h2>
          <p>正在读取本地档案。</p>
        </div></div></div></section>`;
      }

      function renderBootError(error) {
        document.getElementById("app").innerHTML = `<section class="page"><div class="app-shell"><div class="bootstrap-state"><div class="empty-state">
          <span class="empty-icon" aria-hidden="true">${icons.info}</span>
          <h2>无法载入数据</h2>
          <p>${esc(error.message || "请确认本地服务已启动后重试。")}</p>
          <button class="btn-primary" type="button" id="retry-load">重试</button>
        </div></div></div></section>`;
        document.getElementById("retry-load")?.addEventListener("click", boot);
      }

      function route() {
        if (!appReady) return;
        const parsed = parseRoute();
        state.modalTarget = "standalone";
        if (parsed.name !== "graph" && document.body.classList.contains("graph-fullscreen")) {
          exitGraphFullscreen();
        }
        if (document.getElementById("modal-root")?.children.length) closeModal();
        graphCtx = null;
        graphPersonSelection = null;

        if (parsed.name === "people") {
          updateNav("people");
          document.title = "Profiles · 全部档案";
          renderPeoplePage();
        } else if (parsed.name === "person") {
          updateNav("people");
          const person = byId.get(parsed.id);
          if (person) {
            state.expandedSections = new Set();
            document.title = `Profiles · ${person.name}`;
            renderDetailPage(person);
          } else {
            document.title = "Profiles · 未找到档案";
            document.getElementById("app").innerHTML = `<section class="page"><div class="app-shell"><div class="not-found"><h1>未找到该档案</h1><p>链接可能已失效，或档案已被删除。</p><a class="ghost-btn" href="#/people">返回全部档案</a></div></div></section>`;
          }
        } else if (parsed.name === "graph") {
          updateNav("graph");
          document.title = "Profiles · 关系图";
          renderGraphPage(parsed);
        } else {
          updateNav("");
          document.title = "Profiles · 页面不存在";
          document.getElementById("app").innerHTML = `<section class="page"><div class="app-shell"><div class="not-found"><h1>页面不存在</h1><p>请检查地址，或返回全部档案。</p><a class="ghost-btn" href="#/people">返回全部档案</a></div></div></section>`;
        }
      }

      function renderShellError(error) {
        renderBootError(error);
      }

      async function boot() {
        appReady = false;
        renderBootLoading();
        try {
          await loadData();
          appReady = true;
          if (!window.location.hash) {
            window.history.replaceState(null, "", "#/people");
          }
          route();
        } catch (error) {
          console.error("Failed to load Profiles data:", error);
          renderShellError(error);
        }
      }

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (document.body.classList.contains("graph-fullscreen")) {
          exitGraphFullscreen();
          return;
        }
        if (document.getElementById("modal-root")?.children.length) {
          closeModal();
          return;
        }
        if (document.getElementById("graph-side-panel")?.classList.contains("is-open")) {
          graphCtx?.closePanel();
          return;
        }
        if (graphCtx && !document.getElementById("graph-focus-bar")?.hidden) {
          graphCtx.clearFocus();
        }
      });

      window.addEventListener("hashchange", () => {
        if (appReady) route();
      });
      window.addEventListener("resize", () => {
        if (graphCtx) graphCtx.fitView();
      });

      boot();
    })();
  </script>
</body>
</html>
